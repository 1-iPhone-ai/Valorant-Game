                    if (Math.abs(x) < 16 && Math.abs(z) < 16) continue;
                    if (i % 12 === 0) createCylinder(x, 2, z, 0.4, 4, 0x1f2833);
                    else createBox(x, 1, z, 1, 2, 1, 0x3c4e5d);
                    made++;
                }
                for (let i = 0; i < mapBatches.length; i++) scene.remove(mapBatches[i].mesh);
                mapBatches.length = 0;
                for (let i = 0; i < mapPieces.length; i++) {
                    const slices = mapPieces[i].slices;
                    if (!slices) continue;
                    for (let s = 0; s < slices.length; s++) slices[s].batch = null;
                }
                buildMapBatches();
                collisionIndex.cells.clear();
                collisionIndex.revision++;
                for (let i = 0; i < staticColliders.length; i++) {
                    staticColliders[i].indexed = false;
                    collisionIndex.insert(staticColliders[i]);
                }
                for (let i = 0; i < dynamicColliders.length; i++) {
                    const c = dynamicColliders[i];
                    if (c.owner && c.owner.active) {
                        c.indexed = false;
                        collisionIndex.insert(c);
                    }
                }
                mapVisibilityDirty = true;
            },
            stats: function() {
                let enemyPages = 0, enemySlots = 0, targetPages = 0;
                for (const chunk of enemyChunks.values()) {
                    enemyPages += chunk.pages.length;
                    for (let i = 0; i < chunk.pages.length; i++) enemySlots += chunk.pages[i].members.length;
                }
                for (let f = 0; f < targetFamilyList.length; f++) {
                    for (const chunk of targetFamilyList[f].chunks.values()) targetPages += chunk.pages.length;
                }
                return {
                    enemies: enemyObjects.length,
                    targets: targetObjects.length,
                    mapPieces: mapPieces.length,
                    mapBatches: mapBatches.length,
                    enemyPages: enemyPages,
                    enemyPacked: enemySlots,
                    enemyPageCap: ENEMY_PAGE_CAP,
                    enemyOverflow: perfTelemetry.enemyOverflow,
                    targetPages: targetPages,
                    geometries: renderer.info.memory.geometries,
                    programs: renderer.info.programs ? renderer.info.programs.length : 0
                };
            }
        };
        
        function initGame() {
            // Graphics profile (visual budgets only)
            initializeAdaptiveQuality();
            
            // Collision index
            collisionIndex.init();
            
            // Map: render batches, hit proxies, collider records
            createMap();
            buildMapBatches();
            
            // Create weapons
            createWeapons();
            
            // Initialize object pools
            initObjectPools();
            
            // Actors (box-target colliders enter the index before the map's, as before)
            buildActorTemplates();
            initEnemyBatches();
            spawnTargets();
            spawnEnemies();
            
            // Initialize character and camera controllers
            initializeControllers();
            
            // Static map colliders
            for (const collider of staticColliders) {
                collisionIndex.insert(collider);
            }
            
            // Setup mobile controls if needed
            if (deviceInfo.touchEnabled) {
                setupMobileControls();
            }
            
            // Initial weapon setup
            switchWeapon('rifle');
            
            // The scene root never moves; stop it forcing a full world-matrix
            // propagation every frame. Dynamic children still auto-update their own
            // matrices (scene.autoUpdate stays true).
            freezeStaticTransform(scene);
            
            shadowManager.init();
            warmShaderVariants();
            gameInitialized = true;
            
            // Show welcome message
            if (deviceInfo.touchEnabled) {
                showNotification("Welcome! Use left joystick to move and right area to look around.", 5000);
            } else {
                showNotification("Welcome to Valorant FPS! Use WASD to move, mouse to aim, left click to shoot.", 5000);
                setTimeout(() => {
                    showNotification("Press O to cycle quality (Auto/Low/Medium/High), H for emergency reset", 4000);
                }, 5500);
            }
        }
        
        // Animation loop with performance optimizations
        let prevTime = 0;
        let frameCount = 0;
        let lastFpsUpdate = 0;
        let fps = 0;
        let frameIndex = 0; // integer frame counter
        
        // Timing baselines are (re)taken on the first frame after game init and
        // after the tab was hidden, so long pauses never pollute FPS, telemetry or
        // the quality controller.
        let timingResetPending = true;
        let previousCallbackCpu = null;
        let previousSimSteps = 0;
        document.addEventListener('visibilitychange', () => {
            timingResetPending = true;
            if (typeof qualityController !== 'undefined') qualityController.invalidateTrials();
        });
        
        renderer.info.autoReset = false; // reset manually so shadow + main passes are counted together
        
        function animate(time) {
            requestAnimationFrame(animate);
            const cpuStart = performance.now();
            
            if (timingResetPending) {
                timingResetPending = false;
                prevTime = time;
                lastFpsUpdate = time;
                frameCount = 0;
                simAccumulator = 0;
                simClock = time;
                characterController.prevSimPosition.copy(characterController.position);
                previousCallbackCpu = null;
                previousSimSteps = 0;
                perfTelemetry.reset(time);
                qualityController.resetSamples(time, qualityController.PROFILE_SETTLE_MS);
            }
            
            // Raw frame interval (telemetry) vs clamped gameplay delta
            const frameInterval = time - prevTime;
            const delta = Math.min(Math.max(frameInterval, 0) / 1000, 0.1); // Cap delta at 0.1s to prevent huge jumps
            prevTime = time;
            frameIndex++;
            simTime = time;
            
            // Calculate FPS
            frameCount++;
            const elapsed = time - lastFpsUpdate;
            
            if (elapsed >= 1000) {
                fps = Math.round((frameCount * 1000) / elapsed);
                frameCount = 0;
                lastFpsUpdate = time;
                
                perfTelemetry.summarize(time);
                
                // Update FPS display
                if (perfOverlayEnabled) {
                    const s = perfTelemetry.summary;
                    fpsDisplay.textContent =
                        `FPS: ${fps} | Quality: ${adaptiveSettings.currentQuality} (${s.qualityMode}) px ${s.pixelRatio.toFixed(2)}\n` +
                        `ms mean ${s.frameMsMean.toFixed(1)} p95 ${s.frameMsP95.toFixed(1)} p99 ${s.frameMsP99.toFixed(1)} cpu ${s.cpuMsMean.toFixed(2)}/${s.cpuMsP95.toFixed(2)}\n` +
                        `calls ${s.drawCalls} tris ${s.triangles} geo ${s.geometries} prog ${s.programs}\n` +
                        `shadow/s ${s.shadowRefreshesPerSec.toFixed(1)} grid ${s.gridRefs}/${s.gridCells} fx ${s.activeTrails}/${s.activeHitEffects}/${s.activeDecals}/${s.activeFlashLights}\n` +
                        `sim ${s.simStepsMean.toFixed(2)}/f drop ${s.droppedSimMs.toFixed(1)}ms shot ${s.outsideShotCpuMs.toFixed(2)}ms up ${(s.requestedUploadBytes / 1024).toFixed(1)}/${(s.glUploadBytes / 1024).toFixed(1)}kB`;
                } else {
                    fpsDisplay.textContent = `FPS: ${fps} | Quality: ${adaptiveSettings.currentQuality}`;
                }
            }
            
            // Look stays on the display clock so aim is never queued behind sim catch-up
            mouseLookController.update(delta);
            
            if (game.keys.space && !spaceWasDown) jumpQueued = true;
            spaceWasDown = !!game.keys.space;
            
            simAccumulator += delta;
            const simBudget = SIM_DT * SIM_MAX_STEPS;
            if (simAccumulator > simBudget) {
                perfTelemetry.droppedSimMs += (simAccumulator - simBudget) * 1000;
                simAccumulator = simBudget;
            }
            simStepsThisFrame = 0;
            while (simAccumulator >= SIM_DT) {
                characterController.prevSimPosition.copy(characterController.position);
                simClock += SIM_DT * 1000;
                stepSimulation(SIM_DT, simClock);
                simAccumulator -= SIM_DT;
                simStepsThisFrame++;
            }
            presentPlayerCamera(simAccumulator / SIM_DT);
            updateWeaponPosition();
            applyWeaponBobbing(time, game.keys.w || game.keys.a || game.keys.s || game.keys.d);
            
            // Analytic movers + decal cap (render clock)
            updateVisibleObjects(time);
            
            const now = performance.now();
            runActorEvents(now);
            updateActorFlashes(now);
            
            // Pooled effect lifetimes (trails, decal fades, flash lights) + GPU pack
            updatePooledEffects(now);
            packEnemyBatches();
            packTargetBatches();
            
            // Distance eligibility; lifecycle visibility is owned elsewhere and frustum
            // culling is done natively by the renderer
            updateMapVisibility();
            updateTargetVisibility();
            
            if (shadowManager.beforeRender(now)) {
                perfTelemetry.shadowRefreshes++;
            }
            
            // Render scene
            renderer.info.reset();
            renderer.render(scene, camera);
            perfTelemetry.summary.drawCalls = renderer.info.render.calls;
            perfTelemetry.summary.triangles = renderer.info.render.triangles;
            const programCount = renderer.info.programs ? renderer.info.programs.length : 0;
            if (programCount > perfTelemetry.programWatermark) {
                perfTelemetry.firstUseStalls++;
                perfTelemetry.programWatermark = programCount;
            }
            
            // The interval that just elapsed was produced by the previous callback.
            // Pair it with that callback's CPU, then measure this callback including
            // the quality-controller work so the next interval gets a complete cost.
            if (frameInterval > 0 && previousCallbackCpu !== null) {
                perfTelemetry.record(frameInterval, previousCallbackCpu, perfTelemetry.shotCpuPending, previousSimSteps);
                perfTelemetry.shotCpuPending = 0;
                qualityController.sample(time, frameInterval, previousCallbackCpu);
            }
            previousSimSteps = simStepsThisFrame;
            previousCallbackCpu = performance.now() - cpuStart;
        }
        
        // Start load sequence
        let progress = 0;
        const loadInterval = setInterval(() => {
            progress += 5;
            progressFill.style.width = `${progress}%`;
            progressText.textContent = `Loading: ${progress}%`;
            
            if (progress >= 100) {
                clearInterval(loadInterval);
                
                // Hide loading screen
                setTimeout(() => {
                    loadingScreen.style.opacity = "0";
                    setTimeout(() => {
                        loadingScreen.style.display = "none";
                        
                        // Initialize and start the game
                        initGame();
                        
                        // Start animation loop
                        animate(performance.now());
                    }, 500);
                }, 500);
            }
        }, 100);
    </script>
</body>
</html>
