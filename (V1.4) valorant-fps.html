<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimized Valorant 3D FPS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            cursor: none;
        }
        
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        .ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        
        .crosshair-inner {
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(255, 70, 85, 0.5);
        }
        
        .crosshair-line {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 5px rgba(255, 70, 85, 0.3);
        }
        
        .line-top, .line-bottom {
            width: 2px;
            height: 10px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .line-left, .line-right {
            width: 10px;
            height: 2px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .line-top {
            top: -14px;
        }
        
        .line-right {
            right: -14px;
        }
        
        .line-bottom {
            bottom: -14px;
        }
        
        .line-left {
            left: -14px;
        }
        
        .hitmarker {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 20px;
            height: 20px;
            pointer-events: none;
            transition: transform 0.1s ease-out;
        }
        
        .hitmarker-line {
            position: absolute;
            background-color: white;
            box-shadow: 0 0 2px rgba(255, 255, 255, 0.8);
        }
        
        .hit-line-1, .hit-line-3 {
            width: 10px;
            height: 2px;
            top: 50%;
            margin-top: -1px;
        }
        
        .hit-line-2, .hit-line-4 {
            width: 2px;
            height: 10px;
            left: 50%;
            margin-left: -1px;
        }
        
        .hit-line-1 {
            left: 0;
            transform: rotate(45deg);
            transform-origin: left center;
        }
        
        .hit-line-2 {
            top: 0;
            transform: rotate(45deg);
            transform-origin: center top;
        }
        
        .hit-line-3 {
            right: 0;
            transform: rotate(-45deg);
            transform-origin: right center;
        }
        
        .hit-line-4 {
            bottom: 0;
            transform: rotate(-45deg);
            transform-origin: center bottom;
        }
        
        .hud {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        
        .health {
            width: 200px;
        }
        
        .health-bar {
            width: 100%;
            height: 8px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .health-fill {
            height: 100%;
            background: linear-gradient(to right, #ff4655, #ff7b86);
            width: 100%;
            transition: width 0.3s ease-out;
        }
        
        .health-text {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 14px;
        }
        
        .weapon-info {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .ammo-display {
            font-size: 24px;
            font-weight: bold;
            padding: 5px 15px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 10px;
        }
        
        .ammo-current {
            color: white;
        }
        
        .ammo-separator {
            opacity: 0.5;
            margin: 0 5px;
        }
        
        .ammo-max {
            opacity: 0.7;
        }
        
        .weapon-selector {
            display: flex;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            padding: 5px;
        }
        
        .weapon-slot {
            width: 45px;
            height: 35px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin: 0 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            position: relative;
        }
        
        .weapon-slot.active {
            background: rgba(255, 70, 85, 0.3);
            border: 1px solid #ff4655;
            color: white;
        }
        
        .weapon-slot-key {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff4655;
            color: white;
            font-size: 12px;
            padding: 0 4px;
            border-radius: 3px;
        }
        
        .score {
            width: 200px;
            text-align: right;
        }
        
        .score-value {
            font-size: 24px;
            font-weight: bold;
            color: #ff4655;
        }
        
        .reload-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 4px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 2px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .reload-progress {
            height: 100%;
            width: 0%;
            background: #ff4655;
            transition: width linear;
        }
        
        .notification {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 4px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .kill-feed {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }
        
        .kill-message {
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            transform: translateX(100%);
            opacity: 0;
            transition: transform 0.3s, opacity 0.3s;
        }
        
        .kill-message.visible {
            transform: translateX(0);
            opacity: 1;
        }
        
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f1923;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background-color: #ff4655;
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
            margin-bottom: 20px;
        }
        
        .loading-text {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
            letter-spacing: 2px;
            color: white;
        }
        
        .progress-bar {
            width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: #ff4655;
            width: 0%;
            transition: width 0.3s;
        }
        
        .progress-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .damage-indicator {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            background: radial-gradient(circle, transparent 70%, rgba(255, 0, 0, 0.3) 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .settings-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 4px;
            padding: 10px;
            display: none;
        }
        
        .settings-panel h3 {
            margin-bottom: 10px;
            color: #ff4655;
        }
        
        .settings-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .settings-row label {
            margin-right: 10px;
        }
        
        .settings-row input {
            width: 100px;
        }
        
        .fps-display {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0,0,0,0.5);
            color: white;
            padding: 5px;
            border-radius: 3px;
            font-family: monospace;
            z-index: 1000;
        }
        
        /* Mobile touch controls */
        .touch-controls {
            display: none;
            position: absolute;
            bottom: 120px;
            left: 20px;
            flex-direction: column;
            z-index: 1000;
        }
        
        .joystick-container {
            width: 150px;
            height: 150px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            position: relative;
            touch-action: none;
            border: 2px solid rgba(255, 70, 85, 0.7);
        }
        
        .joystick {
            width: 60px;
            height: 60px;
            background-color: rgba(255, 70, 85, 0.7);
            border-radius: 50%;
            position: absolute;
            top: 45px;
            left: 45px;
            transform: translate(-50%, -50%);
        }
        
        .action-buttons {
            display: none;
            position: absolute;
            bottom: 120px;
            right: 20px;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }
        
        .action-button {
            width: 80px;
            height: 80px;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: white;
            user-select: none;
            touch-action: none;
            border: 2px solid rgba(255, 70, 85, 0.7);
        }
        
        .weapon-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .look-area {
            display: none;
            position: absolute;
            top: 0;
            right: 0;
            width: 70%;
            height: 70%;
            z-index: 999;
            touch-action: none;
        }
        
        .quality-toggle {
            position: absolute;
            top: 50px;
            left: 10px;
            background-color: rgba(0,0,0,0.5);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid rgba(255, 70, 85, 0.7);
            cursor: pointer;
            font-size: 14px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loading-screen">
        <div class="logo"></div>
        <div class="loading-text">VALORANT 3D FPS</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-text" id="progress-text">Loading: 0%</div>
    </div>

    <div class="ui">
        <div class="crosshair">
            <div class="crosshair-inner"></div>
            <div class="crosshair-line line-top"></div>
            <div class="crosshair-line line-right"></div>
            <div class="crosshair-line line-bottom"></div>
            <div class="crosshair-line line-left"></div>
        </div>
        
        <div class="hitmarker" id="hitmarker">
            <div class="hitmarker-line hit-line-1"></div>
            <div class="hitmarker-line hit-line-2"></div>
            <div class="hitmarker-line hit-line-3"></div>
            <div class="hitmarker-line hit-line-4"></div>
        </div>
        
        <div class="hud">
            <div class="health">
                <div class="health-text">
                    <span>HEALTH</span>
                    <span id="health-value">100</span>
                </div>
                <div class="health-bar">
                    <div class="health-fill" id="health-fill"></div>
                </div>
            </div>
            
            <div class="weapon-info">
                <div class="ammo-display">
                    <span class="ammo-current" id="ammo-current">30</span>
                    <span class="ammo-separator">/</span>
                    <span class="ammo-max" id="ammo-max">30</span>
                </div>
                <div class="weapon-selector">
                    <div class="weapon-slot active" id="weapon-slot-1">
                        <span class="weapon-slot-key">1</span>
                        AR
                    </div>
                    <div class="weapon-slot" id="weapon-slot-2">
                        <span class="weapon-slot-key">2</span>
                        SR
                    </div>
                </div>
            </div>
            
            <div class="score">
                <div>SCORE</div>
                <div class="score-value" id="score-value">0</div>
            </div>
        </div>
        
        <div class="reload-indicator" id="reload-indicator">
            <div class="reload-progress" id="reload-progress"></div>
        </div>
        
        <div class="notification" id="notification"></div>
        <div class="kill-feed" id="kill-feed"></div>
        <div class="damage-indicator" id="damage-indicator"></div>
        
        <div class="settings-panel" id="settings-panel">
            <h3>Settings</h3>
            <div class="settings-row">
                <label for="sensitivity">Mouse Sensitivity:</label>
                <input type="range" id="sensitivity" min="0.0005" max="0.005" step="0.0005" value="0.002">
            </div>
            <div class="settings-row">
                <label for="smoothing">Camera Smoothing:</label>
                <input type="range" id="smoothing" min="0" max="0.95" step="0.05" value="0.5">
            </div>
            <div class="settings-row">
                <label for="invert-y">Invert Y-Axis:</label>
                <input type="checkbox" id="invert-y">
            </div>
        </div>
        
        <div id="fps-display" class="fps-display">FPS: 0</div>
        <div id="quality-toggle" class="quality-toggle">Quality: Medium</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Game elements
        const loadingScreen = document.getElementById('loading-screen');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        const healthFill = document.getElementById('health-fill');
        const healthValue = document.getElementById('health-value');
        const ammoValue = document.getElementById('ammo-current');
        const ammoMax = document.getElementById('ammo-max');
        const scoreValue = document.getElementById('score-value');
        const hitmarker = document.getElementById('hitmarker');
        const notification = document.getElementById('notification');
        const killFeed = document.getElementById('kill-feed');
        const reloadIndicator = document.getElementById('reload-indicator');
        const reloadProgress = document.getElementById('reload-progress');
        const weaponSlot1 = document.getElementById('weapon-slot-1');
        const weaponSlot2 = document.getElementById('weapon-slot-2');
        const damageIndicator = document.getElementById('damage-indicator');
        const settingsPanel = document.getElementById('settings-panel');
        const sensitivitySlider = document.getElementById('sensitivity');
        const smoothingSlider = document.getElementById('smoothing');
        const invertYCheckbox = document.getElementById('invert-y');
        const fpsDisplay = document.getElementById('fps-display');
        const qualityToggle = document.getElementById('quality-toggle');
        
        // =============================================
        // Performance Monitoring and Adaptive Quality
        // =============================================
        
        // Device detection
        const deviceInfo = {
            isMobile: /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent),
            screenWidth: window.innerWidth,
            screenHeight: window.innerHeight,
            touchEnabled: 'ontouchstart' in window || navigator.maxTouchPoints > 0,
            devicePixelRatio: window.devicePixelRatio || 1,
            hardwareConcurrency: navigator.hardwareConcurrency || 2
        };
        
        // Content tier: fixes the actor population, actor/map model detail, the AI
        // activity radius and the low-tier enemy shot rule for the whole session.
        // It reproduces the tier each device got from the previous startup rule
        // (which also looked at DPR), so difficulty is unchanged per device. It is
        // never used to judge graphics capability, and graphics adaptation never
        // changes it.
        const contentTier = (deviceInfo.isMobile || deviceInfo.hardwareConcurrency <= 4 ||
                             deviceInfo.devicePixelRatio < 2) ? 'low'
                          : deviceInfo.hardwareConcurrency <= 6 ? 'medium' : 'high';
        const CONTENT_TIERS = {
            low:    { enemies: 2, movingTargets: 1, detailedModels: false, targetSegments: 16, cylinderSegments: 8,  fingers: 2, activityRadius: 60 },
            medium: { enemies: 4, movingTargets: 2, detailedModels: true,  targetSegments: 32, cylinderSegments: 16, fingers: 4, activityRadius: 80 },
            high:   { enemies: 4, movingTargets: 3, detailedModels: true,  targetSegments: 32, cylinderSegments: 32, fingers: 4, activityRadius: 100 }
        };
        const CONTENT = CONTENT_TIERS[contentTier];
        
        // Graphics profiles: visual budgets only
        const GRAPHICS_PROFILES = {
            low:    { drawDistance: 60,  maxParticles: 5,  maxDecals: 10, shadows: false, shadowResolution: 1024, fogDensity: 0.01,  maxPixelRatio: 1 },
            medium: { drawDistance: 80,  maxParticles: 10, maxDecals: 20, shadows: true,  shadowResolution: 2048, fogDensity: 0.008, maxPixelRatio: 1.5 },
            // High was 4096; a 4096 vs 2048 pixel comparison at 1920x1080 showed no
            // pixel differing by more than 16/255. Set back to 4096 to restore.
            high:   { drawDistance: 100, maxParticles: 15, maxDecals: 30, shadows: true,  shadowResolution: 2048, fogDensity: 0.005, maxPixelRatio: Infinity }
        };
        const QUALITY_ORDER = ['low', 'medium', 'high'];
        
        // Current visual budgets (written only by applyGraphicsProfile)
        const adaptiveSettings = {
            currentQuality: 'medium',
            shadowResolution: 2048,
            drawDistance: 80,
            maxParticles: 10,
            maxDecals: 20,
            activeDecals: []
        };
        
        // Lightweight frame telemetry. Read window.perfTelemetry.summary from the
        // console, or open the game with #perf in the URL for an on-screen line.
        const perfTelemetry = {
            capacity: 600,
            intervals: new Float32Array(600), // raw (unclamped) frame intervals in ms
            cpu: new Float32Array(600),       // main-thread ms spent in animate()
            sortScratch: new Float32Array(600),
            count: 0,
            head: 0,
            shadowRefreshes: 0,
            windowStart: 0,
            programInvalidations: 0,
            summary: {
                samples: 0,
                frameMsMean: 0,
                frameMsP95: 0,
                frameMsP99: 0,
                frameMsMax: 0,
                cpuMsMean: 0,
                cpuMsP95: 0,
                drawCalls: 0,
                triangles: 0,
                geometries: 0,
                textures: 0,
                programs: 0,
                shadowRefreshesPerSec: 0,
                programInvalidations: 0,
                activeTrails: 0,
                activeHitEffects: 0,
                activeDecals: 0,
                activeFlashLights: 0,
                gridRefs: 0,
                gridCells: 0,
                staticColliders: 0,
                dynamicColliders: 0,
                shootables: 0,
                renderBatches: 0,
                animations: 0,
                scheduledEvents: 0,
                targets: 0,
                enemies: 0,
                quality: '',
                qualityMode: '',
                pixelRatio: 0,
                simStepsMean: 0,
                droppedSimMs: 0,
                requestedUploadBytes: 0,
                glUploadBytes: 0,
                outsideShotCpuMs: 0
            },
            // Whole-run recording. The 600-sample ring above is a rolling window for
            // the overlay, not a 60-second capture, and its per-window p99 must not
            // be averaged into a run statistic.
            runCapacity: 20000,
            runFrame: new Float32Array(20000),
            runCpu: new Float32Array(20000),
            runShot: new Float32Array(20000),
            runSim: new Float32Array(20000),
            runCount: 0,
            runTruncated: false,
            shotCpuPending: 0,
            shotCpuTotal: 0,
            shotCount: 0,
            droppedSimMs: 0,
            simStepsTotal: 0,
            recordedFrames: 0,
            enemyMatrixWrites: 0,
            enemyColorWrites: 0,
            hierarchyUpdates: 0,
            effectPacks: 0,
            requestedUploadBytes: 0,
            glUploadBytes: 0,
            glUploadCalls: 0,
            glBufferDataBytes: 0,
            glBufferDataCalls: 0,
            enemyOverflow: 0,
            enemyOverflowPeak: 0,
            enemyOverflowFrames: 0,
            actorEventSkips: 0,
            mapVisibilitySkips: 0,
            collisionCacheHits: 0,
            shotCandidates: 0,
            shadowEventsIgnored: 0,
            firstUseStalls: 0,
            programWatermark: 0,
            enemyPacked: 0,
            enemyPagesLive: 0,
            _glHooked: false,
            
            record: function(intervalMs, cpuMs, shotMs, simSteps) {
                this.intervals[this.head] = intervalMs;
                this.cpu[this.head] = cpuMs;
                this.head = (this.head + 1) % this.capacity;
                if (this.count < this.capacity) this.count++;
                if (this.runCount < this.runCapacity) {
                    this.runFrame[this.runCount] = intervalMs;
                    this.runCpu[this.runCount] = cpuMs;
                    this.runShot[this.runCount] = shotMs;
                    this.runSim[this.runCount] = simSteps;
                    this.runCount++;
                } else {
                    this.runTruncated = true;
                }
                this.recordedFrames++;
                this.simStepsTotal += simSteps;
            },
            
            noteShot: function(cpuMs) {
                this.shotCpuPending += cpuMs;
                this.shotCpuTotal += cpuMs;
                this.shotCount++;
            },
            
            // Requested upload: scalar updateRange we asked r128 to send.
            // Measured GL bytes are counted separately in instrumentGL().
            requestUpload: function(attr, offset, count) {
                let o = offset, c = count;
                if (attr.needsUpdate && attr._pendCount > 0) {
                    const end = Math.max(attr._pendOffset + attr._pendCount, offset + count);
                    o = Math.min(attr._pendOffset, offset);
                    c = end - o;
                }
                const bpe = attr.array.BYTES_PER_ELEMENT;
                const oldBytes = (attr.needsUpdate && attr._pendCount > 0) ? attr._pendCount * bpe : 0;
                const newBytes = c * bpe;
                this.requestedUploadBytes += Math.max(0, newBytes - oldBytes);
                attr._pendOffset = o;
                attr._pendCount = c;
                attr.updateRange.offset = o;
                attr.updateRange.count = c;
                attr.needsUpdate = true;
            },
            
            instrumentGL: function() {
                if (this._glHooked) return;
                const gl = renderer.getContext();
                const self = this;
                const sub = gl.bufferSubData.bind(gl);
                const data = gl.bufferData.bind(gl);
                gl.bufferSubData = function(target, dst, src, srcOffset, length) {
                    let bytes = 0;
                    if (src && src.BYTES_PER_ELEMENT) {
                        bytes = (typeof length === 'number' ? length : (src.length - (srcOffset || 0))) * src.BYTES_PER_ELEMENT;
                    }
                    self.glUploadBytes += bytes;
                    self.glUploadCalls++;
                    return sub.apply(gl, arguments);
                };
                gl.bufferData = function(target, src) {
                    let bytes = 0;
                    if (src && src.byteLength) bytes = src.byteLength;
                    else if (typeof src === 'number') bytes = src;
                    self.glBufferDataBytes += bytes;
                    self.glBufferDataCalls++;
                    return data.apply(gl, arguments);
                };
                this._glHooked = true;
            },
            
            _stats: function(source, n) {
                if (n <= 0) return null;
                const sorted = new Float32Array(n);

            // Handle collisions with scene objects using spatial partitioning

                    this.position.z = previousPosition.z;

                    this.velocity.z = 0;

                const qMinZ = this.position.z - footprint;
                const qMaxX = this.position.x + footprint;
                const qMaxZ = this.position.z + footprint;
                const q0x = collisionIndex.cellCoord(qMinX), q1x = collisionIndex.cellCoord(qMaxX);
                const q0z = collisionIndex.cellCoord(qMinZ), q1z = collisionIndex.cellCoord(qMaxZ);

                    camera.rotation.x = Math.max(this.maxLookDown, Math.min(this.maxLookUp, newVerticalLook));

                const cpuBound = cpuP95 > p95 * 0.6;
                if (!cpuBound && now >= this.pixelScalingOffUntil &&
                    this.pixelStep < this.PIXEL_SCALES.length - 1) {
                    this.pixelStep++;
                    this.applyPixelRatio();
                    this.pixelCheck = { baselineP95: p95 };
                    this.resetSamples(now, this.PIXEL_SETTLE_MS);
                    return;
                }
                const index = QUALITY_ORDER.indexOf(adaptiveSettings.currentQuality);
                if (index > 0) {
                    const next = QUALITY_ORDER[index - 1];
                    this.log({ kind: 'stepDown', from: adaptiveSettings.currentQuality, to: next, p95: p95, cpuP95: cpuP95 });
                    applyGraphicsProfile(next, 'auto');
                    this.upgradeHoldUntil = now + this.upgradeBackoffMs;
                }
            },
            
            stepUp: function(now, p95) {
                // Restore sharpness before raising expensive profile settings
                if (this.pixelStep > 0) {
                    this.pixelStep--;
                    this.applyPixelRatio();
                    this.trial = { kind: 'pixel', baselineP95: p95, endAt: now + this.TRIAL_MS };
                    this.resetSamples(now, this.PIXEL_SETTLE_MS);
                    return;
                }
                const index = QUALITY_ORDER.indexOf(adaptiveSettings.currentQuality);
                if (index < QUALITY_ORDER.length - 1) {
                    const from = adaptiveSettings.currentQuality;
                    const next = QUALITY_ORDER[index + 1];
                    this.log({ kind: 'stepUp', from: from, to: next, p95: p95 });
                    applyGraphicsProfile(next, 'auto');
                    this.trial = { kind: 'profile', from: from, baselineP95: p95, endAt: now + this.TRIAL_MS };
                }
            },
            
            setManual: function(quality) {
                this.auto = false;
                this.trial = null;
                this.pixelCheck = null;
                this.pixelStep = 0;
                applyGraphicsProfile(quality, 'manual');
            },
            
            setAuto: function() {
                this.auto = true;
                this.trial = null;
                this.pixelCheck = null;
                this.pixelStep = 0;
                this.upgradeHoldUntil = 0;
                this.upgradeBackoffMs = 20000;
                applyGraphicsProfile(adaptiveSettings.currentQuality, 'auto-mode');
                showNotification('Quality set to AUTO');

        };
        window.qualityController = qualityController;
        
        // Quality toggle: Auto -> Low -> Medium -> High -> Auto
        function cycleQualitySettings() {
            if (qualityController.auto) {
                qualityController.setManual('low');
                return;
            }
            switch (adaptiveSettings.currentQuality) {
                case 'low':
                    qualityController.setManual('medium');
                    break;
                case 'medium':
                    qualityController.setManual('high');
                    break;
                case 'high':
                    qualityController.setAuto();
                    break;
            }
        }
        
        function initializeAdaptiveQuality() {
            qualityController.init();

        // Particle capacity per hit effect = largest maxParticles preset (high quality).
        // The active count per effect is set with drawRange at acquisition.
        const MAX_HIT_PARTICLES = 15;
        // Conservative bound for the existing trajectories: |vx|,|vz| <= 0.05 and
        // vy0 in [0, 0.1] with -0.002/step gravity over 60 steps gives at most
        // 3 units horizontally, +2.55 / -3.54 vertically (radius ~5.5).
        const HIT_PARTICLE_BOUND_RADIUS = 6;
        const BULLET_TRAIL_LIFETIME_MS = 100;
        const HIT_EFFECT_FRAMES = 60;
        const DECAL_FADE_DELAY_MS = 5000;
        const DECAL_FADE_STEP_MS = 200;
        
        // Monotonic acquisition counter used to find the oldest active pool item
        let poolAcquireSequence = 0;
        
        // GPU batches for pooled effects. Each effect still has its own lifetime,
        // color, fade and pool slot; only submission is packed. Individual Line /
        // Points / Mesh objects are not added to the scene.
        const effectBatches = {
            trail: null,
            particles: null,
            decals: null
        };
        const _decalColor = new THREE.Color();
        const _decalDummy = new THREE.Object3D();
        let trailsDirty = false;
        let particlesDirty = false;
        let decalsDirty = false;
        let decalVisX = NaN, decalVisY = NaN, decalVisZ = NaN, decalVisDist = NaN;
        
        function initObjectPools() {
            const trailPositions = new Float32Array(POOL_SIZES.bulletTrails * 2 * 3);
            const trailGeometry = new THREE.BufferGeometry();
            trailGeometry.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
            trailGeometry.attributes.position.setUsage(THREE.DynamicDrawUsage);
            trailGeometry.setDrawRange(0, 0);
            trailGeometry.boundingSphere = new THREE.Sphere();
            const trailMaterial = new THREE.LineBasicMaterial({
                color: 0xffcc00,
                opacity: 0.7,
                transparent: true
            });
            const trailMesh = new THREE.LineSegments(trailGeometry, trailMaterial);
            trailMesh.frustumCulled = true;
            trailMesh.visible = false;
            freezeStaticTransform(trailMesh);
            scene.add(trailMesh);
            effectBatches.trail = { mesh: trailMesh, positions: trailPositions };
            
            for (let i = 0; i < POOL_SIZES.bulletTrails; i++) {
                objectPools.bulletTrails.push({
                    object: null,
                    inUse: false,
                    acquireSequence: 0,
                    expireAt: 0,
                    sx: 0, sy: 0, sz: 0, ex: 0, ey: 0, ez: 0
                });
            }
            
            const maxParticleVerts = POOL_SIZES.hitEffects * MAX_HIT_PARTICLES;
            const particlePositions = new Float32Array(maxParticleVerts * 3);
            const particleColors = new Float32Array(maxParticleVerts * 3);
            const particleAlphas = new Float32Array(maxParticleVerts);
            const particleGeometry = new THREE.BufferGeometry();
            particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
            particleGeometry.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));
            particleGeometry.setAttribute('particleAlpha', new THREE.BufferAttribute(particleAlphas, 1));
            particleGeometry.attributes.position.setUsage(THREE.DynamicDrawUsage);
            particleGeometry.attributes.color.setUsage(THREE.DynamicDrawUsage);
            particleGeometry.attributes.particleAlpha.setUsage(THREE.DynamicDrawUsage);
            particleGeometry.setDrawRange(0, 0);
            particleGeometry.boundingSphere = new THREE.Sphere();
            const particleMaterial = new THREE.PointsMaterial({
                size: 0.1,
                transparent: true,
                opacity: 1,
                vertexColors: true,
                depthWrite: false
            });
            // Stock PointsMaterial opacity is uniform; per-system fades live in particleAlpha
            particleMaterial.onBeforeCompile = function (shader) {
                shader.vertexShader = 'attribute float particleAlpha;\nvarying float vParticleAlpha;\n' + shader.vertexShader;
                shader.vertexShader = shader.vertexShader.replace(
                    '#include <color_vertex>',
                    '#include <color_vertex>\n\tvParticleAlpha = particleAlpha;'
                );
                shader.fragmentShader = 'varying float vParticleAlpha;\n' + shader.fragmentShader;
                shader.fragmentShader = shader.fragmentShader.replace(
                    '#include <color_fragment>',
                    '#include <color_fragment>\n\tdiffuseColor.a *= vParticleAlpha;'
                );
            };
            const particleMesh = new THREE.Points(particleGeometry, particleMaterial);
            particleMesh.frustumCulled = true;
            particleMesh.visible = false;
            freezeStaticTransform(particleMesh);
            scene.add(particleMesh);
            effectBatches.particles = {
                mesh: particleMesh,
                positions: particlePositions,
                colors: particleColors,
                alphas: particleAlphas
            };
            
            for (let i = 0; i < POOL_SIZES.hitEffects; i++) {
                const velocities = [];
                const positions = new Float32Array(MAX_HIT_PARTICLES * 3);
                for (let v = 0; v < MAX_HIT_PARTICLES; v++) velocities.push({ x: 0, y: 0, z: 0 });
                objectPools.hitEffects.push({
                    object: null,
                    inUse: false,
                    acquireSequence: 0,
                    velocities: velocities,
                    positions: positions,
                    particleCount: 0,
                    frameCount: 0,
                    colorR: 1, colorG: 0.275, colorB: 0.333,
                    opacity: 0.8
                });
            }
            
            const decalGeometry = new THREE.CircleGeometry(0.1, 8);
            const decalMaterial = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 1,
                depthWrite: false
            });
            decalMaterial.onBeforeCompile = function (shader) {
                shader.vertexShader = 'attribute float instanceOpacity;\nvarying float vInstanceOpacity;\n' + shader.vertexShader;
                shader.vertexShader = shader.vertexShader.replace(
                    '#include <begin_vertex>',
                    '#include <begin_vertex>\n\tvInstanceOpacity = instanceOpacity;'
                );
                shader.fragmentShader = 'varying float vInstanceOpacity;\n' + shader.fragmentShader;
                shader.fragmentShader = shader.fragmentShader.replace(
                    'gl_FragColor = vec4( outgoingLight, diffuseColor.a );',
                    'gl_FragColor = vec4( outgoingLight, diffuseColor.a * vInstanceOpacity );'
                );
            };
            const decalMesh = new THREE.InstancedMesh(decalGeometry, decalMaterial, POOL_SIZES.bulletImpacts);
            decalMesh.frustumCulled = false; // r128 default; packed count is the visible set
            decalMesh.visible = false;
            const decalOpacities = new Float32Array(POOL_SIZES.bulletImpacts);
            decalGeometry.setAttribute('instanceOpacity', new THREE.InstancedBufferAttribute(decalOpacities, 1));
            decalMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            decalGeometry.attributes.instanceOpacity.setUsage(THREE.DynamicDrawUsage);
            decalMesh.setColorAt(0, _decalColor.setHex(0x333333));
            if (decalMesh.instanceColor) decalMesh.instanceColor.setUsage(THREE.DynamicDrawUsage);
            scene.add(decalMesh);
            effectBatches.decals = { mesh: decalMesh, opacities: decalOpacities };
            
            for (let i = 0; i < POOL_SIZES.bulletImpacts; i++) {
                objectPools.bulletImpacts.push({
                    object: { position: new THREE.Vector3(), visible: false },
                    matrix: new THREE.Matrix4(),
                    inUse: false,
                    acquireSequence: 0,
                    fadeOpacity: 0.8,
                    nextFadeAt: 0,
                    renderVisible: false
                });
            }
        }
        
        function packTrailBatch() {
            const batch = effectBatches.trail;
            const dest = batch.positions;
            const trails = objectPools.bulletTrails;
            let n = 0;
            let minX = Infinity, minY = Infinity, minZ = Infinity;
            let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
            for (let i = 0; i < trails.length; i++) {
                const item = trails[i];
                if (!item.inUse) continue;
                const o = n * 6;
                dest[o] = item.sx; dest[o + 1] = item.sy; dest[o + 2] = item.sz;
                dest[o + 3] = item.ex; dest[o + 4] = item.ey; dest[o + 5] = item.ez;
                if (item.sx < minX) minX = item.sx; if (item.sx > maxX) maxX = item.sx;
                if (item.sy < minY) minY = item.sy; if (item.sy > maxY) maxY = item.sy;
                if (item.sz < minZ) minZ = item.sz; if (item.sz > maxZ) maxZ = item.sz;
                if (item.ex < minX) minX = item.ex; if (item.ex > maxX) maxX = item.ex;
                if (item.ey < minY) minY = item.ey; if (item.ey > maxY) maxY = item.ey;
                if (item.ez < minZ) minZ = item.ez; if (item.ez > maxZ) maxZ = item.ez;
                n++;
            }
            const geom = batch.mesh.geometry;
            geom.setDrawRange(0, n * 2);
            if (n === 0) {
                batch.mesh.visible = false;
            } else {
                batch.mesh.visible = true;
                perfTelemetry.requestUpload(geom.attributes.position, 0, n * 6);
                const sphere = geom.boundingSphere;
                sphere.center.set((minX + maxX) * 0.5, (minY + maxY) * 0.5, (minZ + maxZ) * 0.5);
                const dx = maxX - minX, dy = maxY - minY, dz = maxZ - minZ;
                sphere.radius = 0.5 * Math.sqrt(dx * dx + dy * dy + dz * dz);
            }
        }
        
        function packParticleBatch() {
            const batch = effectBatches.particles;
            const dest = batch.positions, colors = batch.colors, alphas = batch.alphas;
            const effects = objectPools.hitEffects;
            let n = 0;
            let minX = Infinity, minY = Infinity, minZ = Infinity;
            let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
            for (let i = 0; i < effects.length; i++) {
                const item = effects[i];
                if (!item.inUse) continue;
                const src = item.positions;
                for (let p = 0; p < item.particleCount; p++) {
                    const x = src[p * 3], y = src[p * 3 + 1], z = src[p * 3 + 2];
                    dest[n * 3] = x; dest[n * 3 + 1] = y; dest[n * 3 + 2] = z;
                    colors[n * 3] = item.colorR; colors[n * 3 + 1] = item.colorG; colors[n * 3 + 2] = item.colorB;
                    alphas[n] = item.opacity;
                    if (x < minX) minX = x; if (x > maxX) maxX = x;
                    if (y < minY) minY = y; if (y > maxY) maxY = y;
                    if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
                    n++;
                }
            }
            const geom = batch.mesh.geometry;
            geom.setDrawRange(0, n);
            if (n === 0) {
                batch.mesh.visible = false;
            } else {
                batch.mesh.visible = true;
                perfTelemetry.requestUpload(geom.attributes.position, 0, n * 3);
                perfTelemetry.requestUpload(geom.attributes.color, 0, n * 3);
                perfTelemetry.requestUpload(geom.attributes.particleAlpha, 0, n);
                const sphere = geom.boundingSphere;
                sphere.center.set((minX + maxX) * 0.5, (minY + maxY) * 0.5, (minZ + maxZ) * 0.5);
                const dx = maxX - minX, dy = maxY - minY, dz = maxZ - minZ;
                sphere.radius = 0.5 * Math.sqrt(dx * dx + dy * dy + dz * dz) + HIT_PARTICLE_BOUND_RADIUS;
            }
        }
        
        function packDecalBatch() {
            const batch = effectBatches.decals;
            const mesh = batch.mesh;
            const decals = objectPools.bulletImpacts;
            const opacities = batch.opacities;
            let n = 0;
            for (let i = 0; i < decals.length; i++) {
                const item = decals[i];
                if (!item.inUse || !item.renderVisible) continue;
                mesh.setMatrixAt(n, item.matrix);
                mesh.setColorAt(n, _decalColor.setHex(0x333333));
                opacities[n] = item.fadeOpacity;
                n++;
            }
            mesh.count = n;
            mesh.visible = n > 0;
            if (n === 0) return;
            perfTelemetry.requestUpload(mesh.instanceMatrix, 0, n * 16);
            if (mesh.instanceColor) perfTelemetry.requestUpload(mesh.instanceColor, 0, n * 3);
            perfTelemetry.requestUpload(mesh.geometry.attributes.instanceOpacity, 0, n);
        }
        
        // Get an object from pool
        function getFromPool(poolName) {
            const pool = objectPools[poolName];
            let item = null;
            
            // Find an unused object
            for (let i = 0; i < pool.length; i++) {
                if (!pool[i].inUse) {
                    item = pool[i];
                    break;
                }
            }
            
            // If no free objects, recycle the oldest active acquisition
            if (!item) {
                item = pool[0];
                for (let i = 1; i < pool.length; i++) {
                    if (pool[i].acquireSequence < item.acquireSequence) {
                        item = pool[i];
                    }
                }
                releaseToPool(item, poolName);
            }
            
            item.inUse = true;
            item.acquireSequence = ++poolAcquireSequence;
            if (item.object) item.object.visible = true;
            return item;
        }
        
        // Release object back to pool (idempotent)
        function releaseToPool(poolItem, poolName) {
            if (!poolItem.inUse) return;
            poolItem.inUse = false;
            if (poolItem.object) poolItem.object.visible = false;
            if (poolName === 'bulletImpacts') poolItem.renderVisible = false;
            
            if (poolName === 'bulletTrails') trailsDirty = true;
            else if (poolName === 'hitEffects') particlesDirty = true;
            else if (poolName === 'bulletImpacts') {
                decalsDirty = true;
                const index = adaptiveSettings.activeDecals.indexOf(poolItem);
                if (index !== -1) {
                    adaptiveSettings.activeDecals.splice(index, 1);
                }
            }
        }
        
        // Advance one hit effect by one frame step (same step as the original rAF chain)
        function stepHitEffect(poolItem) {
            poolItem.frameCount++;
            
            if (poolItem.frameCount > HIT_EFFECT_FRAMES) {
                releaseToPool(poolItem, 'hitEffects');
                return;
            }
            
            const positions = poolItem.positions;
            const velocities = poolItem.velocities;
            
            for (let i = 0; i < poolItem.particleCount; i++) {
                const velocity = velocities[i];
                // Apply velocity
                positions[i * 3] += velocity.x;
                positions[i * 3 + 1] += velocity.y;
                positions[i * 3 + 2] += velocity.z;
                
                // Apply gravity
                velocity.y -= 0.002;
            }
            
            // Fade out
            poolItem.opacity = 0.8 * (1 - poolItem.frameCount / HIT_EFFECT_FRAMES);
            particlesDirty = true;
        }
        
        // Enemy flash light: reuse a free pooled light, else the oldest active one
        // (visual only; the shot itself is never skipped)
        function acquireEnemyFlash(x, y, z) {
            if (!qualityController.enemyFlashLightsEnabled) return;
            let item = null;
            for (let i = 0; i < enemyFlashLights.length; i++) {
                if (!enemyFlashLights[i].inUse) {
                    item = enemyFlashLights[i];
                    break;
                }
            }
            if (!item) {
                item = enemyFlashLights[0];
                for (let i = 1; i < enemyFlashLights.length; i++) {
                    if (enemyFlashLights[i].acquireSequence < item.acquireSequence) item = enemyFlashLights[i];
                }
            }
            item.inUse = true;
            item.acquireSequence = ++poolAcquireSequence;
            item.expireAt = performance.now() + ENEMY_FLASH_DURATION_MS;
            item.object.position.set(x, y, z);
            item.object.visible = true;
        }
        
        // Single lifetime owner for every pooled effect; called once per frame
        function updatePooledEffects(now) {
            for (let i = 0; i < enemyFlashLights.length; i++) {
                const item = enemyFlashLights[i];
                if (item.inUse && now >= item.expireAt) {
                    item.inUse = false;
                    item.object.visible = false;
                }
            }
            
            const trails = objectPools.bulletTrails;
            for (let i = 0; i < trails.length; i++) {
                const item = trails[i];
                if (item.inUse && now >= item.expireAt) {
                    releaseToPool(item, 'bulletTrails');
                }
            }
            
            const playerPosition = characterController.position;
            const drawDistance = adaptiveSettings.drawDistance;
            const visScan = playerPosition.x !== decalVisX || playerPosition.y !== decalVisY ||
                playerPosition.z !== decalVisZ || drawDistance !== decalVisDist;
            if (visScan) {
                decalVisX = playerPosition.x;
                decalVisY = playerPosition.y;
                decalVisZ = playerPosition.z;
                decalVisDist = drawDistance;
            }
            const drawDistanceSq = drawDistance * drawDistance;
            const decals = objectPools.bulletImpacts;
            for (let i = 0; i < decals.length; i++) {
                const item = decals[i];
                if (!item.inUse) continue;
                
                // Discrete fade: -0.05 opacity every 200 ms after the 5 s delay
                while (item.inUse && now >= item.nextFadeAt) {
                    item.fadeOpacity -= 0.05;
                    decalsDirty = true;
                    if (item.fadeOpacity <= 0) {
                        releaseToPool(item, 'bulletImpacts');
                    } else {
                        item.nextFadeAt += DECAL_FADE_STEP_MS;
                    }
                }
                
                if (item.inUse && visScan) {
                    const visible = item.object.position.distanceToSquared(playerPosition) < drawDistanceSq;
                    if (visible !== item.renderVisible) {
                        item.renderVisible = visible;
                        decalsDirty = true;
                    }
                }
            }
            
            if (trailsDirty) { packTrailBatch(); trailsDirty = false; perfTelemetry.effectPacks++; }
            if (particlesDirty) { packParticleBatch(); particlesDirty = false; perfTelemetry.effectPacks++; }
            if (decalsDirty) { packDecalBatch(); decalsDirty = false; perfTelemetry.effectPacks++; }
        }
        
        // =============================================
        // Map: instanced render batches, exact hit proxies, scalar colliders
        // =============================================
        const MAP_CHUNK_SIZE = 50;
        // Hit proxies keep the exact per-piece geometry the old meshes had, so hit
        // points and face normals are unchanged. They are never added to the scene
        // or rendered, so they are never uploaded to the GPU.
        const shootProxyMaterial = new THREE.MeshBasicMaterial();
        // One shared lit material; each piece's color comes from instanceColor
        const mapMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7, metalness: 0.3 });
        let unitBoxGeometry = null;
        let unitCylinderGeometry = null;
        const _pieceQuaternion = new THREE.Quaternion();
        const _piecePosition = new THREE.Vector3();
        const _pieceScale = new THREE.Vector3();
        const _pieceColor = new THREE.Color();
        
        // Create map elements
        function createMap() {
            // Create walls
            createBox(-50, 10, 0, 1, 20, 100, 0x1f2833); // Left wall
            createBox(50, 10, 0, 1, 20, 100, 0x1f2833);  // Right wall
            createBox(0, 10, -50, 100, 20, 1, 0x1f2833); // Back wall
            createBox(0, 10, 50, 100, 20, 1, 0x1f2833);  // Front wall
            
            // Create central structure
            createBox(0, 5, 0, 20, 10, 20, 0x2c3e50);
            createBox(0, 11, 0, 15, 2, 15, 0x2c3e50);
            
            // Create platform to the side
            createBox(-20, 2.5, -20, 10, 5, 10, 0x3c4e5d);
            createBox(20, 2.5, -20, 10, 5, 10, 0x3c4e5d);
            
            // Create ramps
            createBox(-10, 1.25, -10, 10, 2.5, 5, 0x2c3e50);
            createBox(10, 1.25, -10, 10, 2.5, 5, 0x2c3e50);
            
            // Create some pillars
            createCylinder(-15, 5, 15, 1, 10, 0x1f2833);
            createCylinder(15, 5, 15, 1, 10, 0x1f2833);
            createCylinder(-15, 5, -15, 1, 10, 0x1f2833);
            createCylinder(15, 5, -15, 1, 10, 0x1f2833);
            
            // Create small crates
            createBox(-25, 1, -25, 2, 2, 2, 0x3c4e5d);
            createBox(-23, 1, -25, 2, 2, 2, 0x3c4e5d);
            createBox(-25, 3, -25, 2, 2, 2, 0x3c4e5d);
            createBox(25, 1, -25, 2, 2, 2, 0x3c4e5d);
            createBox(23, 1, -25, 2, 2, 2, 0x3c4e5d);
            createBox(25, 3, -25, 2, 2, 2, 0x3c4e5d);
            createBox(-25, 1, 25, 2, 2, 2, 0x3c4e5d);
            createBox(25, 1, 25, 2, 2, 2, 0x3c4e5d);
            
            // Create some accent features
            createBox(-30, 0.5, 0, 5, 1, 30, 0xff4655);
            createBox(30, 0.5, 0, 5, 1, 30, 0x4672ff);
        }
        
        function ensureUnitMapGeometry() {
            if (unitBoxGeometry) return;
            unitBoxGeometry = new THREE.BoxGeometry(1, 1, 1);
            unitCylinderGeometry = new THREE.CylinderGeometry(1, 1, 1, CONTENT.cylinderSegments);
        }
        
        // Box: render instance + shared-geometry hit proxy + static collider.
        // The proxy is a unit box scaled to the piece, so 10,000 map boxes do not
        // allocate 10,000 geometries. Face layout matches BoxGeometry(w, h, d).
        function createBox(x, y, z, width, height, depth, color = 0x3c4e5d) {
            const piece = registerMapPiece('box', x, y, z, width, height, depth, color);
            const collider = createColliderRecord('static', piece);
            setColliderFromBox3(collider, piece.bounds, x, z);
            staticColliders.push(collider);
            return piece;
        }
        
        // Cylinder: render instance + hit proxy (not collidable, as before)
        function createCylinder(x, y, z, radius, height, color = 0x3c4e5d) {
            return registerMapPiece('cylinder', x, y, z, radius, height, radius, color);
        }
        
        function registerMapPiece(shape, x, y, z, scaleX, scaleY, scaleZ, color) {
            ensureUnitMapGeometry();
            const proxy = new THREE.Mesh(shape === 'box' ? unitBoxGeometry : unitCylinderGeometry, shootProxyMaterial);
            proxy.position.set(x, y, z);
            proxy.scale.set(scaleX, scaleY, scaleZ);
            proxy.updateMatrixWorld(true);
            
            // World-space AABB (same Box3.setFromObject result the old collision used)
            const bounds = new THREE.Box3().setFromObject(proxy);
            
            const matrix = new THREE.Matrix4().compose(
                _piecePosition.set(x, y, z),
                _pieceQuaternion.identity(),
                _pieceScale.set(scaleX, scaleY, scaleZ)
            );
            
            const piece = {
                shape: shape,
                x: x, y: y, z: z,
                color: color,
                matrix: matrix,
                bounds: bounds,
                proxy: proxy,
                scaleX: scaleX, scaleY: scaleY, scaleZ: scaleZ,
                visible: true,
                batch: null,
                slices: null
            };
            buildRenderSlices(piece);
            mapPieces.push(piece);
            environmentShootables.push(piece);
            envShotIndex.insert(piece);
            shootableOwners.set(proxy, { kind: 'env', actor: null });
            mapVisibilityDirty = true;
            return piece;
        }
        
        // Group pieces by shape and spatial chunk into InstancedMeshes. Each batch's
        // geometry shares the unit-shape buffers but owns its bounds (the union of
        // its members' full AABBs), so frustum culling works per chunk and a long
        // wall is never culled because its chunk or center is far away.
        // r128 InstancedMesh disables frustum culling by default and has no
        // per-instance bounds, so the batch bounds are set here explicitly.
        // Walls of 100 units sit in one chunk and their bounds defeat distance and
        // frustum culling. Split only the render instance; the hit proxy and the
        // collider stay the original box so shots and push-out are unchanged.
        function buildRenderSlices(piece) {
            const limit = MAP_CHUNK_SIZE;
            const sx = piece.scaleX, sy = piece.scaleY, sz = piece.scaleZ;
            const slices = [];
            const push = (cx, cz, ssx, ssy, ssz) => {
                const matrix = new THREE.Matrix4().compose(
                    _piecePosition.set(cx, piece.y, cz),
                    _pieceQuaternion.identity(),
                    _pieceScale.set(ssx, ssy, ssz)
                );
                const bounds = new THREE.Box3(
                    new THREE.Vector3(cx - ssx * 0.5, piece.y - ssy * 0.5, cz - ssz * 0.5),
                    new THREE.Vector3(cx + ssx * 0.5, piece.y + ssy * 0.5, cz + ssz * 0.5)
                );
                slices.push({
                    matrix: matrix, bounds: bounds, x: cx, z: cz,
                    shape: piece.shape, color: piece.color,
                    visible: true, batch: null, piece: piece
                });
            };
            if (sx <= limit && sz <= limit) {
                slices.push({
                    matrix: piece.matrix, bounds: piece.bounds, x: piece.x, z: piece.z,
                    shape: piece.shape, color: piece.color,
                    visible: true, batch: null, piece: piece
                });
            } else if (sx >= sz) {
                const n = Math.ceil(sx / limit);
                const slice = sx / n;
                const origin = piece.x - sx * 0.5;
                for (let i = 0; i < n; i++) push(origin + slice * (i + 0.5), piece.z, slice, sy, sz);
            } else {
                const n = Math.ceil(sz / limit);
                const slice = sz / n;
                const origin = piece.z - sz * 0.5;
                for (let i = 0; i < n; i++) push(piece.x, origin + slice * (i + 0.5), sx, sy, slice);
            }
            piece.slices = slices;
        }
        
        function buildMapBatches() {
            ensureUnitMapGeometry();
            
            const groups = new Map();
            for (const piece of mapPieces) {
                if (!piece.slices) buildRenderSlices(piece);
                for (const slice of piece.slices) {
                    const key = slice.shape + ':' + Math.floor(slice.x / MAP_CHUNK_SIZE) + ',' + Math.floor(slice.z / MAP_CHUNK_SIZE);
                    if (!groups.has(key)) groups.set(key, []);
                    groups.get(key).push(slice);
                }
            }
            
            for (const [key, members] of groups) {
                const source = members[0].shape === 'box' ? unitBoxGeometry : unitCylinderGeometry;
                const geometry = new THREE.BufferGeometry();
                geometry.setIndex(source.index);
                for (const name in source.attributes) {
                    geometry.setAttribute(name, source.attributes[name]);
                }
                const bounds = new THREE.Box3();
                for (const piece of members) bounds.union(piece.bounds);
                geometry.boundingBox = bounds;
                geometry.boundingSphere = bounds.getBoundingSphere(new THREE.Sphere());
                
                const mesh = new THREE.InstancedMesh(geometry, mapMaterial, members.length);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.frustumCulled = true;
                mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
                
                const batch = { key: key, mesh: mesh, members: members, bounds: bounds, dirty: true, visibleCount: 0 };
                for (const piece of members) piece.batch = batch;
                refreshMapBatch(batch);
                freezeStaticTransform(mesh);
                scene.add(mesh);
                mapBatches.push(batch);
            }
        }
        
        // Rewrite a batch's instance buffers with its currently visible members
        function refreshMapBatch(batch) {
            const mesh = batch.mesh;
            let n = 0;
            for (const piece of batch.members) {
                if (!piece.visible) continue;
                mesh.setMatrixAt(n, piece.matrix);
                mesh.setColorAt(n, _pieceColor.setHex(piece.color));
                n++;
            }
            mesh.count = n;
            mesh.visible = n > 0;
            if (n > 0) {
                if (mesh.instanceColor && mesh.instanceColor.usage !== THREE.DynamicDrawUsage) {
                    mesh.instanceColor.setUsage(THREE.DynamicDrawUsage);
                }
                perfTelemetry.requestUpload(mesh.instanceMatrix, 0, n * 16);
                if (mesh.instanceColor) perfTelemetry.requestUpload(mesh.instanceColor, 0, n * 3);
            }
            batch.visibleCount = n;
            batch.dirty = false;
        }
        
        function pointAabbDistanceSq(px, py, pz, b) {
            const dx = px < b.min.x ? b.min.x - px : (px > b.max.x ? px - b.max.x : 0);
            const dy = py < b.min.y ? b.min.y - py : (py > b.max.y ? py - b.max.y : 0);
            const dz = pz < b.min.z ? b.min.z - pz : (pz > b.max.z ? pz - b.max.z : 0);
            return dx * dx + dy * dy + dz * dz;
        }
        
        function pointAabbFarthestSq(px, py, pz, b) {
            const x = Math.abs(px - b.min.x) > Math.abs(px - b.max.x) ? b.min.x : b.max.x;
            const y = Math.abs(py - b.min.y) > Math.abs(py - b.max.y) ? b.min.y : b.max.y;
            const z = Math.abs(pz - b.min.z) > Math.abs(pz - b.max.z) ? b.min.z : b.max.z;
            const dx = px - x, dy = py - y, dz = pz - z;
            return dx * dx + dy * dy + dz * dz;
        }
        
        // Distance eligibility per map piece, measured to the nearest point of its
        // AABB (not its center), so large walls stay visible while any part is near.
        // Camera rotation does not invalidate this; the renderer frustum-culls chunks.
        let mapVisX = NaN, mapVisY = NaN, mapVisZ = NaN, mapVisDist = NaN;
        let mapVisibilityDirty = true;
        function updateMapVisibility() {
            const p = characterController.position;
            const drawDistance = adaptiveSettings.drawDistance;
            if (!mapVisibilityDirty && p.x === mapVisX && p.y === mapVisY && p.z === mapVisZ && drawDistance === mapVisDist) {
                perfTelemetry.mapVisibilitySkips++;
                return;
            }
            mapVisX = p.x;
            mapVisY = p.y;
            mapVisZ = p.z;
            mapVisDist = drawDistance;
            mapVisibilityDirty = false;
            const drawDistanceSq = drawDistance * drawDistance;
            let changed = false;
            const setSlice = (slice, visible) => {
                if (slice.visible === visible) return;
                slice.visible = visible;
                slice.batch.dirty = true;
                changed = true;
            };
            for (let b = 0; b < mapBatches.length; b++) {
                const batch = mapBatches[b];
                const box = batch.bounds;
                const near = pointAabbDistanceSq(p.x, p.y, p.z, box);
                if (near >= drawDistanceSq) {
                    for (let s = 0; s < batch.members.length; s++) setSlice(batch.members[s], false);
                    continue;
                }
                if (pointAabbFarthestSq(p.x, p.y, p.z, box) < drawDistanceSq) {
                    for (let s = 0; s < batch.members.length; s++) setSlice(batch.members[s], true);
                    continue;
                }
                for (let s = 0; s < batch.members.length; s++) {
                    const slice = batch.members[s];
                    setSlice(slice, pointAabbDistanceSq(p.x, p.y, p.z, slice.bounds) < drawDistanceSq);
                }
            }
            if (!changed) return;
            let shadowHit = false;
            for (let i = 0; i < mapBatches.length; i++) {
                const batch = mapBatches[i];
                if (!batch.dirty) continue;
                const b = batch.bounds;
                const cx = (b.min.x + b.max.x) * 0.5;
                const cy = (b.min.y + b.max.y) * 0.5;
                const cz = (b.min.z + b.max.z) * 0.5;
                const dx = b.max.x - b.min.x, dy = b.max.y - b.min.y, dz = b.max.z - b.min.z;
                const radius = 0.5 * Math.sqrt(dx * dx + dy * dy + dz * dz);
                if (shadowManager.sphereHits(cx, cy, cz, radius)) shadowHit = true;
                refreshMapBatch(batch);
            }
            if (shadowHit) shadowManager.motionDirty = true;
        }
        
        // =============================================
        // Geometry merging (static, same-material parts)
        // =============================================
        // parts: [{ geometry, matrix }] with indexed geometries carrying
        // position/normal/uv. Returns one indexed geometry with the parts baked in.
        function mergeGeometryParts(parts) {
            let vertexCount = 0;
            let indexCount = 0;
            const baked = parts.map(part => {
                const g = part.geometry.clone();
                g.applyMatrix4(part.matrix);
                vertexCount += g.attributes.position.count;
                indexCount += g.index ? g.index.count : g.attributes.position.count;
                return g;
            });
            const positions = new Float32Array(vertexCount * 3);
            const normals = new Float32Array(vertexCount * 3);
            const uvs = new Float32Array(vertexCount * 2);
            const indices = vertexCount > 65535 ? new Uint32Array(indexCount) : new Uint16Array(indexCount);
            let vOffset = 0;
            let iOffset = 0;
            for (const g of baked) {
                const count = g.attributes.position.count;
                positions.set(g.attributes.position.array, vOffset * 3);
                normals.set(g.attributes.normal.array, vOffset * 3);
                if (g.attributes.uv) uvs.set(g.attributes.uv.array, vOffset * 2);
                if (g.index) {
                    const src = g.index.array;
                    for (let i = 0; i < src.length; i++) indices[iOffset + i] = src[i] + vOffset;
                    iOffset += src.length;
                } else {
                    for (let i = 0; i < count; i++) indices[iOffset + i] = i + vOffset;
                    iOffset += count;
                }
                vOffset += count;
                g.dispose();
            }
            const merged = new THREE.BufferGeometry();
            merged.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            merged.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
            merged.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
            merged.setIndex(new THREE.BufferAttribute(indices, 1));
            merged.computeBoundingBox();
            merged.computeBoundingSphere();
            return merged;
        }
        
        function partMatrix(x, y, z, rx, ry, rz) {
            const m = new THREE.Matrix4();
            const e = new THREE.Euler(rx || 0, ry || 0, rz || 0);
            return m.compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(e), new THREE.Vector3(1, 1, 1));
        }

        function createHandsMesh(handZ) {
            const palmGeometry = new THREE.BoxGeometry(0.04, 0.08, 0.06);
            const fingerGeometry = new THREE.BoxGeometry(0.018, 0.05, 0.018);
            const thumbGeometry = new THREE.BoxGeometry(0.02, 0.04, 0.02);

                    });

                parts.push({ geometry: thumbGeometry, matrix: hand.clone().multiply(partMatrix(0.03, 0.02, 0, 0, 0, Math.PI / 4)) });

        // =============================================

        // record and bumps its generation, so nothing is disposed during play and
        // stale animations/events (tagged with an older generation) are ignored.

        // Rotation-invariant bound radius of an actor around its root origin
        function computeActorRadius(root) {
            let radius = 0;
            root.updateMatrixWorld(true);
            const inverse = new THREE.Matrix4().copy(root.matrixWorld).invert();
            const center = new THREE.Vector3();
            for (const leaf of [root, ...root.children]) {
                if (!leaf.geometry) continue;

                        side: THREE.DoubleSide

                centerDot.position.z = 0.07;
                centerDot.rotation.x = Math.PI / 2;
                root.add(centerDot);

            actor.initialPosition.y = y;
            actor.initialPosition.z = z;
            actor.moveData = moveData;

            perfTelemetry.enemyPacked = packed;
            perfTelemetry.enemyPagesLive = enemyPagesLive;
            perfTelemetry.enemyPageCap = ENEMY_PAGE_CAP;
            
            for (const chunk of enemyChunks.values()) {
                const pages = chunk.pages;
                for (let pi = 0; pi < pages.length; pi++) {
                    const page = pages[pi];
                    if (!page.live || (!page.structureDirty && !page.poseDirty && !page.colorDirty)) continue;
                    const members = page.members;
                    const n = members.length;
                    const writeAll = page.structureDirty;
                    let matrixLo = Infinity, matrixHi = -1, colorLo = Infinity, colorHi = -1;
                    for (let s = 0; s < n; s++) {
                        const enemy = members[s];
                        const writeMatrix = writeAll || enemy.poseDirty;
                        const writeColor = writeAll || enemy.colorDirty;
                        if (!writeMatrix && !writeColor) continue;
                        const leaves = enemy.leaves;
                        const meshes = page.meshes;
                        const parts = Math.min(leaves.length, meshes.length);
                        for (let p = 0; p < parts; p++) {
                            if (writeMatrix) {
                                meshes[p].setMatrixAt(s, leaves[p].matrixWorld);
                                perfTelemetry.enemyMatrixWrites++;
                            }
                            if (writeColor) {
                                meshes[p].setColorAt(s, leaves[p].material.color);
                                perfTelemetry.enemyColorWrites++;
                            }
                        }
                        if (writeMatrix) { if (s < matrixLo) matrixLo = s; if (s > matrixHi) matrixHi = s; }
                        if (writeColor) { if (s < colorLo) colorLo = s; if (s > colorHi) colorHi = s; }
                        enemy.poseDirty = false;
                        enemy.colorDirty = false;
                    }
                    for (let p = 0; p < page.meshes.length; p++) {
                        const mesh = page.meshes[p];
                        mesh.count = n;
                        mesh.visible = n > 0;
                        if (n === 0) continue;
                        if (matrixHi >= matrixLo) {
                            perfTelemetry.requestUpload(mesh.instanceMatrix, matrixLo * 16, (matrixHi - matrixLo + 1) * 16);
                        }
                        if (mesh.instanceColor && colorHi >= colorLo) {
                            perfTelemetry.requestUpload(mesh.instanceColor, colorLo * 3, (colorHi - colorLo + 1) * 3);
                        }
                    }
                    page.structureDirty = false;
                    page.poseDirty = false;
                    page.colorDirty = false;
                }
            }
        }

        // Weapon bobbing when walking
        function applyWeaponBobbing(time, isMoving) {
            const activeWeapon = game.weapons[game.activeWeapon].model;
            if (!activeWeapon) return;
            
            // Bob intensity: min(sqrt(x^2 + z^2), 1) with x, z in {0, 1} is simply 0 or 1
            const moveMagnitude = (game.keys.a || game.keys.d || game.keys.w || game.keys.s) ? 1 : 0;
            
            if (isMoving && moveMagnitude > 0) {
                const bobbingSpeed = characterController.sprinting ? 12 : 8;
                const bobbingAmount = characterController.sprinting ? 0.02 : 0.01;
                
                // More natural bobbing curve
                const verticalBob = Math.sin(time * 0.01 * bobbingSpeed) * bobbingAmount * moveMagnitude;
                const horizontalBob = Math.cos(time * 0.005 * bobbingSpeed) * bobbingAmount * 0.5 * moveMagnitude;
                
                // Smooth transition to bobbing position
                activeWeapon.position.y = THREE.MathUtils.lerp(activeWeapon.position.y, -0.3 + verticalBob, 0.2);
                activeWeapon.position.x = THREE.MathUtils.lerp(activeWeapon.position.x, 0.3 + horizontalBob, 0.2);
                
                // Slight weapon tilt when moving
                const tiltAmount = 0.03 * moveMagnitude;
                activeWeapon.rotation.z = THREE.MathUtils.lerp(activeWeapon.rotation.z, 
                    (game.keys.a ? tiltAmount : game.keys.d ? -tiltAmount : 0), 0.1);
            } else {
                // Smoothly return to idle position
                activeWeapon.position.y = THREE.MathUtils.lerp(activeWeapon.position.y, -0.3, 0.1);
                activeWeapon.position.x = THREE.MathUtils.lerp(activeWeapon.position.x, 0.3, 0.1);
                activeWeapon.rotation.z = THREE.MathUtils.lerp(activeWeapon.rotation.z, 0, 0.1);
            }
        }

        // =============================================
        // Shot hit testing
        // =============================================
        // Complete candidate selection within WEAPON_RANGE:
        //  - map proxies: grid walk over every XZ cell the ray segment crosses in an
        //    extent-aware index (each piece is listed in every cell its AABB
        //    overlaps), then an AABB slab test;
        //  - live targets/enemies: flat list with a rotation-invariant bound sphere.
        // Candidate leaves get exact raycasts with recursive=false into one reused
        // array. Eligibility is explicit (alive flags); visibility and culling never
        // decide what can be hit.
        // Range: the old candidate sampling always reached a target 110 units away in
        // every tested direction (72 directions/origins), reached 111-127 units only
        // in some directions and never beyond 127. 110 is therefore the distance the
        // old code reliably covered, made explicit and direction-independent.
        const WEAPON_RANGE = 110;
        const _shotHits = [];
        const _shotNormalMatrix = new THREE.Matrix3();
        const _shotWorldNormal = new THREE.Vector3();
        let simTime = 0; // rAF time of the current/last presented frame (shots / movers)
        const SIM_HZ = 60;
        const SIM_DT = 1 / SIM_HZ;
        const SIM_MAX_STEPS = 4; // cap catch-up; leftover is clamped, not spiraled
        let simClock = 0; // accumulated 60 Hz clock in ms
        let simAccumulator = 0;
        let simStepsThisFrame = 0;
        
        // Static extent-aware index of map hit proxies (same key scheme as collisionIndex)
        const envShotIndex = {
            cellSize: 10,
            cells: new Map(),
            stamp: 0,
            minCX: Infinity, maxCX: -Infinity, minCZ: Infinity, maxCZ: -Infinity,
            
            cellCoord: function(v) {
                const c = Math.floor(v / this.cellSize);
                return c < -512 ? -512 : (c > 511 ? 511 : c);
            },
            
            insert: function(piece) {
                const b = piece.bounds;
                const c0x = this.cellCoord(b.min.x), c1x = this.cellCoord(b.max.x);
                const c0z = this.cellCoord(b.min.z), c1z = this.cellCoord(b.max.z);
                for (let cx = c0x; cx <= c1x; cx++) {
                    for (let cz = c0z; cz <= c1z; cz++) {
                        const k = (cx + 512) * 1024 + (cz + 512);
                        let cell = this.cells.get(k);
                        if (!cell) {
                            cell = [];
                            this.cells.set(k, cell);
                        }
                        cell.push(piece);
                    }
                }
                if (c0x < this.minCX) this.minCX = c0x;
                if (c1x > this.maxCX) this.maxCX = c1x;
                if (c0z < this.minCZ) this.minCZ = c0z;
                if (c1z > this.maxCZ) this.maxCZ = c1z;
                piece.shotStamp = 0;
            },
            
            visitCell: function(cx, cz, ray, range) {
                if (cx < this.minCX || cx > this.maxCX || cz < this.minCZ || cz > this.maxCZ) return;
                const cell = this.cells.get((cx + 512) * 1024 + (cz + 512));
                if (!cell) return;

            const patrolCos = Math.cos(patrolTime);

                if (enemy.tier === 'frozen' && enemy.gridStamp !== nearStamp) continue;

                const distanceToPlayerSq = playerPosition.distanceToSquared(pos);
