<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimized Valorant 3D FPS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            cursor: none;
        }
        
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        .ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        
        .crosshair-inner {
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(255, 70, 85, 0.5);
        }
        
        .crosshair-line {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 5px rgba(255, 70, 85, 0.3);
        }
        
        .line-top, .line-bottom {
            width: 2px;
            height: 10px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .line-left, .line-right {
            width: 10px;
            height: 2px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .line-top {
            top: -14px;
        }
        
        .line-right {
            right: -14px;
        }
        
        .line-bottom {
            bottom: -14px;
        }
        
        .line-left {
            left: -14px;
        }
        
        .hitmarker {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 20px;
            height: 20px;
            pointer-events: none;
            transition: transform 0.1s ease-out;
        }
        
        .hitmarker-line {
            position: absolute;
            background-color: white;
            box-shadow: 0 0 2px rgba(255, 255, 255, 0.8);
        }
        
        .hit-line-1, .hit-line-3 {
            width: 10px;
            height: 2px;
            top: 50%;
            margin-top: -1px;
        }
        
        .hit-line-2, .hit-line-4 {
            width: 2px;
            height: 10px;
            left: 50%;
            margin-left: -1px;
        }
        
        .hit-line-1 {
            left: 0;
            transform: rotate(45deg);
            transform-origin: left center;
        }
        
        .hit-line-2 {
            top: 0;
            transform: rotate(45deg);
            transform-origin: center top;
        }
        
        .hit-line-3 {
            right: 0;
            transform: rotate(-45deg);
            transform-origin: right center;
        }
        
        .hit-line-4 {
            bottom: 0;
            transform: rotate(-45deg);
            transform-origin: center bottom;
        }
        
        .hud {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        
        .health {
            width: 200px;
        }
        
        .health-bar {
            width: 100%;
            height: 8px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .health-fill {
            height: 100%;
            background: linear-gradient(to right, #ff4655, #ff7b86);
            width: 100%;
            transition: width 0.3s ease-out;
        }
        
        .health-text {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 14px;
        }
        
        .weapon-info {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .ammo-display {
            font-size: 24px;
            font-weight: bold;
            padding: 5px 15px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 10px;
        }
        
        .ammo-current {
            color: white;
        }
        
        .ammo-separator {
            opacity: 0.5;
            margin: 0 5px;
        }
        
        .ammo-max {
            opacity: 0.7;
        }
        
        .weapon-selector {
            display: flex;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            padding: 5px;
        }
        
        .weapon-slot {
            width: 45px;
            height: 35px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin: 0 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            position: relative;
        }
        
        .weapon-slot.active {
            background: rgba(255, 70, 85, 0.3);
            border: 1px solid #ff4655;
            color: white;
        }
        
        .weapon-slot-key {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff4655;
            color: white;
            font-size: 12px;
            padding: 0 4px;
            border-radius: 3px;
        }
        
        .score {
            width: 200px;
            text-align: right;
        }
        
        .score-value {
            font-size: 24px;
            font-weight: bold;
            color: #ff4655;
        }
        
        .reload-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 4px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 2px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .reload-progress {
            height: 100%;
            width: 0%;
            background: #ff4655;
            transition: width linear;
        }
        
        .notification {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 4px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .kill-feed {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }
        
        .kill-message {
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            transform: translateX(100%);
            opacity: 0;
            transition: transform 0.3s, opacity 0.3s;
        }
        
        .kill-message.visible {
            transform: translateX(0);
            opacity: 1;
        }
        
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f1923;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background-color: #ff4655;
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
            margin-bottom: 20px;
        }
        
        .loading-text {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
            letter-spacing: 2px;
            color: white;
        }
        
        .progress-bar {
            width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: #ff4655;
            width: 0%;
            transition: width 0.3s;
        }
        
        .progress-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .damage-indicator {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            background: radial-gradient(circle, transparent 70%, rgba(255, 0, 0, 0.3) 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .settings-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 4px;
            padding: 10px;
            display: none;
        }
        
        .settings-panel h3 {
            margin-bottom: 10px;
            color: #ff4655;
        }
        
        .settings-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .settings-row label {
            margin-right: 10px;
        }
        
        .settings-row input {
            width: 100px;
        }
        
        .fps-display {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0,0,0,0.5);
            color: white;
            padding: 5px;
            border-radius: 3px;
            font-family: monospace;
            z-index: 1000;
        }
        
        /* Mobile touch controls */
        .touch-controls {
            display: none;
            position: absolute;
            bottom: 120px;
            left: 20px;
            flex-direction: column;
            z-index: 1000;
        }
        
        .joystick-container {
            width: 150px;
            height: 150px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            position: relative;
            touch-action: none;
            border: 2px solid rgba(255, 70, 85, 0.7);
        }
        
        .joystick {
            width: 60px;
            height: 60px;
            background-color: rgba(255, 70, 85, 0.7);
            border-radius: 50%;
            position: absolute;
            top: 45px;
            left: 45px;
            transform: translate(-50%, -50%);
        }
        
        .action-buttons {
            display: none;
            position: absolute;
            bottom: 120px;
            right: 20px;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }
        
        .action-button {
            width: 80px;
            height: 80px;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: white;
            user-select: none;
            touch-action: none;
            border: 2px solid rgba(255, 70, 85, 0.7);
        }
        
        .weapon-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .look-area {
            display: none;
            position: absolute;
            top: 0;
            right: 0;
            width: 70%;
            height: 70%;
            z-index: 999;
            touch-action: none;
        }
        
        .quality-toggle {
            position: absolute;
            top: 50px;
            left: 10px;
            background-color: rgba(0,0,0,0.5);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid rgba(255, 70, 85, 0.7);
            cursor: pointer;
            font-size: 14px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loading-screen">
        <div class="logo"></div>
        <div class="loading-text">VALORANT 3D FPS</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-text" id="progress-text">Loading: 0%</div>
    </div>

    <div class="ui">
        <div class="crosshair">
            <div class="crosshair-inner"></div>
            <div class="crosshair-line line-top"></div>
            <div class="crosshair-line line-right"></div>
            <div class="crosshair-line line-bottom"></div>
            <div class="crosshair-line line-left"></div>
        </div>
        
        <div class="hitmarker" id="hitmarker">
            <div class="hitmarker-line hit-line-1"></div>
            <div class="hitmarker-line hit-line-2"></div>
            <div class="hitmarker-line hit-line-3"></div>
            <div class="hitmarker-line hit-line-4"></div>
        </div>
        
        <div class="hud">
            <div class="health">
                <div class="health-text">
                    <span>HEALTH</span>
                    <span id="health-value">100</span>
                </div>
                <div class="health-bar">
                    <div class="health-fill" id="health-fill"></div>
                </div>
            </div>
            
            <div class="weapon-info">
                <div class="ammo-display">
                    <span class="ammo-current" id="ammo-current">30</span>
                    <span class="ammo-separator">/</span>
                    <span class="ammo-max" id="ammo-max">30</span>
                </div>
                <div class="weapon-selector">
                    <div class="weapon-slot active" id="weapon-slot-1">
                        <span class="weapon-slot-key">1</span>
                        AR
                    </div>
                    <div class="weapon-slot" id="weapon-slot-2">
                        <span class="weapon-slot-key">2</span>
                        SR
                    </div>
                </div>
            </div>
            
            <div class="score">
                <div>SCORE</div>
                <div class="score-value" id="score-value">0</div>
            </div>
        </div>
        
        <div class="reload-indicator" id="reload-indicator">
            <div class="reload-progress" id="reload-progress"></div>
        </div>
        
        <div class="notification" id="notification"></div>
        <div class="kill-feed" id="kill-feed"></div>
        <div class="damage-indicator" id="damage-indicator"></div>
        
        <div class="settings-panel" id="settings-panel">
            <h3>Settings</h3>
            <div class="settings-row">
                <label for="sensitivity">Mouse Sensitivity:</label>
                <input type="range" id="sensitivity" min="0.0005" max="0.005" step="0.0005" value="0.002">
            </div>
            <div class="settings-row">
                <label for="smoothing">Camera Smoothing:</label>
                <input type="range" id="smoothing" min="0" max="0.95" step="0.05" value="0.5">
            </div>
            <div class="settings-row">
                <label for="invert-y">Invert Y-Axis:</label>
                <input type="checkbox" id="invert-y">
            </div>
        </div>
        
        <div id="fps-display" class="fps-display">FPS: 0</div>
        <div id="quality-toggle" class="quality-toggle">Quality: Medium</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Game elements
        const loadingScreen = document.getElementById('loading-screen');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        const healthFill = document.getElementById('health-fill');
        const healthValue = document.getElementById('health-value');
        const ammoValue = document.getElementById('ammo-current');
        const ammoMax = document.getElementById('ammo-max');
        const scoreValue = document.getElementById('score-value');
        const hitmarker = document.getElementById('hitmarker');
        const notification = document.getElementById('notification');
        const killFeed = document.getElementById('kill-feed');
        const reloadIndicator = document.getElementById('reload-indicator');
        const reloadProgress = document.getElementById('reload-progress');
        const weaponSlot1 = document.getElementById('weapon-slot-1');
        const weaponSlot2 = document.getElementById('weapon-slot-2');
        const damageIndicator = document.getElementById('damage-indicator');
        const settingsPanel = document.getElementById('settings-panel');
        const sensitivitySlider = document.getElementById('sensitivity');
        const smoothingSlider = document.getElementById('smoothing');
        const invertYCheckbox = document.getElementById('invert-y');
        const fpsDisplay = document.getElementById('fps-display');
        const qualityToggle = document.getElementById('quality-toggle');
        
        // =============================================
        // Performance Monitoring and Adaptive Quality
        // =============================================
        
        // Device detection
        const deviceInfo = {
            isMobile: /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent),
            isLowEnd: false,
            screenWidth: window.innerWidth,
            screenHeight: window.innerHeight,
            touchEnabled: 'ontouchstart' in window || navigator.maxTouchPoints > 0,
            devicePixelRatio: window.devicePixelRatio || 1,
            hardwareConcurrency: navigator.hardwareConcurrency || 2
        };
        
        // Detect low-end devices
        deviceInfo.isLowEnd = deviceInfo.isMobile || 
                             (deviceInfo.hardwareConcurrency <= 4) || 
                             (deviceInfo.devicePixelRatio < 2);
        
        // Adaptive quality settings
        const adaptiveSettings = {
            currentQuality: 'medium', // 'low', 'medium', 'high'
            targetFps: 55,
            checkInterval: 2000, // ms between quality adjustments
            lastCheck: 0,
            lowFpsCount: 0,
            shadowResolution: 2048,
            drawDistance: 100,
            maxParticles: 15,
            maxDecals: 30,
            activeDecals: [],
            fpsHistory: []
        };
        
        // Game state
        const game = {
            health: 100,
            score: 0,
            targets: [],
            enemies: [],
            shooting: false,
            reloading: false,
            mouseDown: false,
            activeWeapon: 'rifle',
            weapons: {
                rifle: {
                    name: 'Assault Rifle',
                    damage: 25,
                    ammo: 30,
                    maxAmmo: 30,
                    reloadTime: 2.2,
                    fireRate: 100,
                    automatic: true,
                    recoil: 0.02,
                    spread: 0.01,
                    model: null,
                    muzzleFlash: null
                },
                sniper: {
                    name: 'Sniper Rifle',
                    damage: 100,
                    ammo: 5,
                    maxAmmo: 5,
                    reloadTime: 3,
                    fireRate: 800,
                    automatic: false,
                    recoil: 0.1,
                    spread: 0.001,
                    model: null,
                    muzzleFlash: null
                }
            },
            keys: {
                w: false,
                a: false,
                s: false,
                d: false,
                r: false,
                space: false,
                shift: false,
                one: false,
                two: false
            },
            autoShootInterval: null,
            lastShot: 0
        };
        
        // =============================================
        // Object Pooling System
        // =============================================
        const objectPools = {
            bulletTrails: [],
            hitEffects: [],
            bulletImpacts: [],
            particles: []
        };
        
        // Configure pool sizes
        const POOL_SIZES = {
            bulletTrails: 30,
            hitEffects: 20,
            bulletImpacts: 30,
            particles: 50
        };
        
        // =============================================
        // Spatial Partitioning for Collision Detection
        // =============================================
        
        // Grid-based spatial partitioning system
        const spatialGrid = {
            cellSize: 10, // Size of each grid cell
            cells: {}, // Map of cell coordinates to objects in that cell
            
            // Initialize the grid
            init: function() {
                this.cells = {};
            },
            
            // Get the cell key for a given position
            getCellKey: function(x, z) {
                const cellX = Math.floor(x / this.cellSize);
                const cellZ = Math.floor(z / this.cellSize);
                return `${cellX},${cellZ}`;
            },
            
            // Add an object to the grid
            addObject: function(object) {
                if (!object.position) return;
                
                const key = this.getCellKey(object.position.x, object.position.z);
                
                if (!this.cells[key]) {
                    this.cells[key] = [];
                }
                
                // Store the cell key on the object for faster updates
                object.gridKey = key;
                this.cells[key].push(object);
            },
            
            // Remove an object from the grid
            removeObject: function(object) {
                if (!object.gridKey || !this.cells[object.gridKey]) return;
                
                const index = this.cells[object.gridKey].indexOf(object);
                if (index !== -1) {
                    this.cells[object.gridKey].splice(index, 1);
                }
                
                object.gridKey = null;
            },
            
            // Update object position in the grid
            updateObject: function(object) {
                if (!object.position) return;
                
                const newKey = this.getCellKey(object.position.x, object.position.z);
                
                // If the object has moved to a new cell
                if (object.gridKey !== newKey) {
                    this.removeObject(object);
                    object.gridKey = newKey;
                    
                    if (!this.cells[newKey]) {
                        this.cells[newKey] = [];
                    }
                    
                    this.cells[newKey].push(object);
                }
            },
            
            // Get all objects in cells near a position
            getNearbyObjects: function(x, z, radius = 5) {
                const nearbyObjects = [];
                const cellRadius = Math.ceil(radius / this.cellSize);
                const centerCellX = Math.floor(x / this.cellSize);
                const centerCellZ = Math.floor(z / this.cellSize);
                
                // Check cells in the neighborhood
                for (let i = -cellRadius; i <= cellRadius; i++) {
                    for (let j = -cellRadius; j <= cellRadius; j++) {
                        const key = `${centerCellX + i},${centerCellZ + j}`;
                        if (this.cells[key]) {
                            nearbyObjects.push(...this.cells[key]);
                        }
                    }
                }
                
                return nearbyObjects;
            }
        };
        
        // Create three.js scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a2530);
        scene.fog = new THREE.FogExp2(0x1a2530, 0.005);
        
        // Create camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.7, 0); // Eye level height
        camera.rotation.order = 'YXZ'; // Important for FPS camera
        
        // Create renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        
        // Create lights
        const ambientLight = new THREE.AmbientLight(0xcccccc, 0.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7.5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 100;
        directionalLight.shadow.camera.left = -30;
        directionalLight.shadow.camera.right = 30;
        directionalLight.shadow.camera.top = 30;
        directionalLight.shadow.camera.bottom = -30;
        scene.add(directionalLight);
        
        // Add accent lights for atmosphere
        const redLight = new THREE.PointLight(0xff4655, 1, 50);
        redLight.position.set(-20, 10, -20);
        scene.add(redLight);
        
        const blueLight = new THREE.PointLight(0x4672ff, 1, 50);
        blueLight.position.set(20, 10, -20);
        scene.add(blueLight);
        
        // Create floor
        const floorGeometry = new THREE.PlaneGeometry(200, 200, 20, 20);
        const floorMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x1f2833,
            roughness: 0.8,
            metalness: 0.2
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);
        
        // Create grid helper
        const gridHelper = new THREE.GridHelper(200, 100, 0x6ecbff, 0x222233);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);
        
        // Collection for game objects
        const objects = [];
        const targetObjects = [];
        const enemyObjects = [];
        
        // Frustum for culling
        const frustum = new THREE.Frustum();
        const projScreenMatrix = new THREE.Matrix4();
        
        // Check if object is in view frustum
        function isInViewFrustum(object) {
            // Update frustum
            projScreenMatrix.multiplyMatrices(
                camera.projectionMatrix,
                camera.matrixWorldInverse
            );

            // Use object bounding sphere or box for checking
            if (!object.geometry) return true;
            
            if (!object.geometry.boundingSphere) {
                object.geometry.computeBoundingSphere();
            }
            
            const boundingSphere = object.geometry.boundingSphere.clone();
            boundingSphere.applyMatrix4(object.matrixWorld);
            
            return frustum.intersectsSphere(boundingSphere);

            sprinting: false,                      // Is currently sprinting
            
            // Collision tracking
            lastPosition: new THREE.Vector3(),     // For unstuck detection

                this.lastShadowUpdatePosition = this.position.clone();
                
                // Initialize rotation
                this.rotation.set(0, 0, 0);
                this.targetRotation.set(0, 0, 0);
            },
            
            // Update character position based on inputs
            update: function(delta) {
                // Store previous position for collision detection
                const previousPosition = this.position.clone();
                
                // Calculate movement direction from input
                let moveX = 0;
                let moveZ = 0;
                
                // Get WASD input (using correct movement direction)
                if (game.keys.w) moveZ -= 1;  // Forward (negative Z in Three.js)
                if (game.keys.s) moveZ += 1;  // Backward (positive Z in Three.js)
                if (game.keys.a) moveX -= 1;  // Left
                if (game.keys.d) moveX += 1;  // Right
                
                // Calculate current move speed (sprint or walk)
                const currentSpeed = this.sprinting ? this.sprintSpeed : this.walkSpeed;
                
                // Only apply movement if there's input
                if (moveX !== 0 || moveZ !== 0) {
                    // Get camera's horizontal facing direction
                    const cameraDirection = new THREE.Vector3();
                    camera.getWorldDirection(cameraDirection);
                    cameraDirection.y = 0; // Keep movement on horizontal plane
                    cameraDirection.normalize();
                    
                    // Update target rotation based on movement direction
                    if (moveZ > 0) {
                        // When moving forward, gradually rotate character to face the camera direction
                        this.targetRotation.y = camera.rotation.y;
                    }
                    
                    // Smoothly interpolate towards target rotation
                    this.rotation.y = THREE.MathUtils.lerp(
                        this.rotation.y,
                        this.targetRotation.y,
                        delta * this.turnSpeed
                    );
                    
                    // Get forward and right vectors based on character's rotation
                    const forwardVector = new THREE.Vector3(
                        Math.sin(this.rotation.y),
                        0,
                        Math.cos(this.rotation.y)
                    );
                    
                    const rightVector = new THREE.Vector3(
                        Math.sin(this.rotation.y - Math.PI/2),
                        0,
                        Math.cos(this.rotation.y - Math.PI/2)
                    );
                    
                    // Calculate forward and right movement
                    const forwardMovement = forwardVector.clone().multiplyScalar(moveZ * currentSpeed);
                    const rightMovement = rightVector.clone().multiplyScalar(moveX * currentSpeed);
                    
                    // Apply movement to velocity
                    this.velocity.x += forwardMovement.x + rightMovement.x;
                    this.velocity.z += forwardMovement.z + rightMovement.z;
                }
                
                // Apply gravity if not grounded
                if (!this.grounded) {
                    this.velocity.y -= this.gravity * delta;
                } else if (game.keys.space && this.grounded) {
                    // Jump if on ground and space pressed
                    this.velocity.y = this.jumpForce;
                    this.grounded = false;
                    this.jumping = true;
                }
                
                // Apply friction to horizontal movement
                this.velocity.x *= this.friction;
                this.velocity.z *= this.friction;
                
                // Update position based on velocity
                this.position.x += this.velocity.x;
                this.position.z += this.velocity.z;
                this.position.y += this.velocity.y;
                
                // Floor collision (ensure character doesn't fall through the floor)
                if (this.position.y < this.height) {
                    this.position.y = this.height;
                    this.velocity.y = 0;
                    this.grounded = true;
                    this.jumping = false;
                }
                
                // Check for collisions with objects
                this.handleCollisions(previousPosition);
                
                // Check for being stuck
                this.checkIfStuck();
                
                // Update shadow if needed
                this.updateShadowsIfNeeded();
                
                // Update camera position to follow character
                camera.position.copy(this.position);
            },
            
            // Handle collisions with scene objects using spatial partitioning
            handleCollisions: function(previousPosition) {
                // Map boundaries check
                const mapSize = 95;
                if (Math.abs(this.position.x) > mapSize || Math.abs(this.position.z) > mapSize) {
                    this.position.x = previousPosition.x;
                    this.position.z = previousPosition.z;
                    this.velocity.x = 0;
                    this.velocity.z = 0;
                }
                
                // Get only nearby objects for collision checking
                const nearbyObjects = spatialGrid.getNearbyObjects(
                    this.position.x, 
                    this.position.z,
                    this.radius + 5 // Check slightly beyond character radius
                );
                
                // Character's collision box (calculated once)
                const characterBox = new THREE.Box3(
                    new THREE.Vector3(
                        this.position.x - this.radius,
                        this.position.y - this.height,
                        this.position.z - this.radius
                    ),
                    new THREE.Vector3(
                        this.position.x + this.radius,
                        this.position.y,
                        this.position.z + this.radius
                    )
                );
                
                // Flag to check if we collided with anything
                let collided = false;
                
                // Check only nearby objects
                for (const object of nearbyObjects) {
                    // Skip objects without geometry (like lights)
                    if (!object.geometry) continue;
                    
                    // Skip non-collidable objects
                    if (object.userData && object.userData.nonCollidable) continue;
                    
                    if (object.geometry.type === 'BoxGeometry') {
                        // Reuse bounding box if available, otherwise compute new one
                        let box;
                        
                        if (object.boundingBox) {
                            box = object.boundingBox.clone();
                            box.applyMatrix4(object.matrixWorld);
                        } else {
                            box = new THREE.Box3().setFromObject(object);
                            // Cache the bounding box on static objects
                            if (!object.userData || !object.userData.dynamic) {
                                object.boundingBox = box.clone();
                                object.boundingBox.applyMatrix4(object.matrixWorldInverse);
                            }
                        }
                        
                        // Quick distance check before detailed collision
                        const objectCenter = box.getCenter(new THREE.Vector3());
                        const characterCenter = characterBox.getCenter(new THREE.Vector3());
                        const distance = objectCenter.distanceTo(characterCenter);
                        
                        // If objects are far apart, skip detailed collision check
                        if (distance > this.radius + box.getSize(new THREE.Vector3()).length() / 2) {
                            continue;
                        }
                        
                        // Check for collision
                        if (characterBox.intersectsBox(box)) {
                            collided = true;
                            
                            // Calculate overlap - optimized to avoid unnecessary calculations
                            let overlapX = 0;
                            let overlapZ = 0;
                            
                            if (this.position.x > objectCenter.x) {
                                overlapX = box.max.x - characterBox.min.x;
                            } else {
                                overlapX = characterBox.max.x - box.min.x;
                            }
                            
                            if (this.position.z > objectCenter.z) {
                                overlapZ = box.max.z - characterBox.min.z;
                            } else {
                                overlapZ = characterBox.max.z - box.min.z;
                            }
                            
                            // Resolve collision on smallest overlap axis
                            if (overlapX < overlapZ) {
                                // X-axis collision
                                if (this.position.x > objectCenter.x) {
                                    this.position.x = box.max.x + this.radius;
                                } else {
                                    this.position.x = box.min.x - this.radius;
                                }
                                this.velocity.x = 0;
                            } else {
                                // Z-axis collision
                                if (this.position.z > objectCenter.z) {
                                    this.position.z = box.max.z + this.radius;
                                } else {
                                    this.position.z = box.min.z - this.radius;
                                }
                                this.velocity.z = 0;
                            }
                            
                            // Update character box after position change
                            characterBox.set(
                                new THREE.Vector3(
                                    this.position.x - this.radius,
                                    this.position.y - this.height,
                                    this.position.z - this.radius
                                ),
                                new THREE.Vector3(
                                    this.position.x + this.radius,
                                    this.position.y,
                                    this.position.z + this.radius
                                )
                            );
                            
                            // Check if we can step up onto this object
                            const objectHeight = box.max.y;
                            if (objectHeight <= this.height * 1.2 && this.position.y <= objectHeight) {
                                this.position.y = Math.max(this.position.y, objectHeight);
                                this.grounded = true;
                            }
                        }
                    }
                }
                
                return collided;
            },
            
            // Check if character is stuck and try to resolve
            checkIfStuck: function() {
                const distanceMoved = this.position.distanceTo(this.lastPosition);
                const now = Date.now();
                
                // If moved significantly, reset stuck counter
                if (distanceMoved > 0.01) {
                    this.lastPosition.copy(this.position);
                    this.lastMoveTime = now;
                    this.stuckCounter = 0;
                    return;
                }
                
                // Check if player is trying to move but can't
                if ((game.keys.w || game.keys.a || game.keys.s || game.keys.d) && 
                    (now - this.lastMoveTime > 2000)) {
                    
                    // Try to unstuck by moving up
                    this.position.y += 0.2;
                    this.velocity.y = 0.1;
                    this.lastMoveTime = now;
                    this.stuckCounter++;
                    
                    // If still stuck after multiple attempts, teleport to a safe location
                    if (this.stuckCounter > 5) {
                        this.position.set(0, this.height + 5, 0);
                        this.velocity.set(0, 0, 0);
                        this.stuckCounter = 0;
                        showNotification("You've been teleported to a safe location");
                    }
                }
            },

            setSprinting: function(isSprinting) {
                this.sprinting = isSprinting;

            reset: function() {
                this.position.set(0, this.height + 1, 0);
                this.velocity.set(0, 0, 0);
                this.rotation.set(0, 0, 0);
                this.targetRotation.set(0, 0, 0);
                this.grounded = true;
                this.jumping = false;
                this.stuckCounter = 0;
                camera.position.copy(this.position);

            // Force shadow updates only when needed
            updateShadowsIfNeeded: function() {
                if (!this.lastShadowUpdatePosition) {
                    this.lastShadowUpdatePosition = this.position.clone();
                    renderer.shadowMap.needsUpdate = true;
                    return;
                }
                
                // Only update shadows when player moves more than 1 unit
                const playerMoved = this.position.distanceToSquared(this.lastShadowUpdatePosition) > 1;
                
                if (playerMoved) {
                    this.lastShadowUpdatePosition.copy(this.position);
                    renderer.shadowMap.needsUpdate = true;
                }
            }
        };

        // Mouse look controller (separates camera rotation from movement)
        const mouseLookController = {
            // Mouse settings
            sensitivity: 0.002,
            invertY: false,
            maxLookUp: Math.PI/2 - 0.1,   // Almost 90 degrees up
            maxLookDown: -Math.PI/2 + 0.1, // Almost 90 degrees down
            
            // Smoothing properties
            smoothing: 0.5, // Higher values = smoother (between 0 and 1)
            currentLookSpeed: { x: 0, y: 0 },
            
            // Initialize mouse controller
            init: function() {
                // Set initial camera rotation
                camera.rotation.order = 'YXZ'; // This order is important for FPS camera
                camera.rotation.set(0, 0, 0);
                
                this.currentLookSpeed = { x: 0, y: 0 };
                
                // Setup sensitivity and smoothing controls
                sensitivitySlider.addEventListener('input', (e) => {
                    this.sensitivity = parseFloat(e.target.value);
                });
                
                smoothingSlider.addEventListener('input', (e) => {
                    this.smoothing = parseFloat(e.target.value);
                });
                
                invertYCheckbox.addEventListener('change', (e) => {
                    this.invertY = e.target.checked;
                });
            },
            
            // Handle mouse movement with smoothing
            handleMouseMove: function(e) {
                if (!isPointerLocked) return;
                
                // Calculate target rotational change
                const targetRotationX = -e.movementY * this.sensitivity * (this.invertY ? -1 : 1);
                const targetRotationY = -e.movementX * this.sensitivity;
                
                // Apply smoothing
                this.currentLookSpeed.x = this.currentLookSpeed.x * this.smoothing + targetRotationX * (1 - this.smoothing);
                this.currentLookSpeed.y = this.currentLookSpeed.y * this.smoothing + targetRotationY * (1 - this.smoothing);
                
                // Apply vertical rotation with constraints
                const newVerticalLook = camera.rotation.x + this.currentLookSpeed.x;
                camera.rotation.x = Math.max(this.maxLookDown, Math.min(this.maxLookUp, newVerticalLook));
                
                // Apply horizontal rotation
                camera.rotation.y += this.currentLookSpeed.y;
                
                // Update weapon sway based on actual rotation change, not mouse movement
                applyWeaponSway(this.currentLookSpeed.y * 500, this.currentLookSpeed.x * 500);
            },
            
            // Update method for continuous smoothing
            update: function(delta) {
                // Gradually reduce look speed when no input to prevent jittering
                this.currentLookSpeed.x *= Math.pow(0.85, delta * 60);
                this.currentLookSpeed.y *= Math.pow(0.85, delta * 60);
                
                // Apply any residual movement
                if (Math.abs(this.currentLookSpeed.x) > 0.0001 || Math.abs(this.currentLookSpeed.y) > 0.0001) {
                    // Apply vertical rotation with constraints
                    const newVerticalLook = camera.rotation.x + this.currentLookSpeed.x;
                    camera.rotation.x = Math.max(this.maxLookDown, Math.min(this.maxLookUp, newVerticalLook));
                    
                    // Apply horizontal rotation
                    camera.rotation.y += this.currentLookSpeed.y;
                }
            }
        };

        // Set quality based on device capabilities
        function setQualityBasedOnDevice() {
            if (deviceInfo.isMobile || deviceInfo.isLowEnd) {
                setQualitySettings('low');
            } else if (deviceInfo.hardwareConcurrency <= 6) {
                setQualitySettings('medium');
            } else {
                setQualitySettings('high');
            }
        }
        
        // Apply quality settings
        function setQualitySettings(quality) {
            adaptiveSettings.currentQuality = quality;
            
            switch (quality) {
                case 'low':
                    adaptiveSettings.drawDistance = 60;
                    adaptiveSettings.maxParticles = 5;
                    adaptiveSettings.maxDecals = 10;
                    adaptiveSettings.shadowResolution = 1024;
                    renderer.shadowMap.enabled = false;
                    scene.fog.density = 0.01;
                    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1));
                    break;
                case 'medium':
                    adaptiveSettings.drawDistance = 80;
                    adaptiveSettings.maxParticles = 10;
                    adaptiveSettings.maxDecals = 20;
                    adaptiveSettings.shadowResolution = 2048;
                    renderer.shadowMap.enabled = true;
                    scene.fog.density = 0.008;
                    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
                    break;
                case 'high':
                    adaptiveSettings.drawDistance = 100;
                    adaptiveSettings.maxParticles = 15;
                    adaptiveSettings.maxDecals = 30;
                    adaptiveSettings.shadowResolution = 4096;
                    renderer.shadowMap.enabled = true;
                    scene.fog.density = 0.005;
                    renderer.setPixelRatio(window.devicePixelRatio);
                    break;
            }
            
            // Apply shadow resolution
            directionalLight.shadow.mapSize.width = adaptiveSettings.shadowResolution;
            directionalLight.shadow.mapSize.height = adaptiveSettings.shadowResolution;
            
            // Update quality display
            qualityToggle.textContent = `Quality: ${quality.charAt(0).toUpperCase() + quality.slice(1)}`;
            
            showNotification(`Quality set to ${quality.toUpperCase()}`);
        }
        
        // Initialize object pools
        function initObjectPools() {
            // Bullet trails pool
            for (let i = 0; i < POOL_SIZES.bulletTrails; i++) {
                const trailGeometry = new THREE.BufferGeometry();
                const positions = new Float32Array(2 * 3); // 2 points, 3 coordinates each
                trailGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                
                const trailMaterial = new THREE.LineBasicMaterial({
                    color: 0xffcc00,
                    opacity: 0.7,
                    transparent: true
                });
                
                const trail = new THREE.Line(trailGeometry, trailMaterial);
                trail.visible = false;
                scene.add(trail);
                objectPools.bulletTrails.push({
                    object: trail,
                    inUse: false,
                    releaseTime: 0
                });
            }
            
            // Hit effects pool - reuse particle systems
            const particleGeometry = new THREE.BufferGeometry();
            const particleCount = adaptiveSettings.maxParticles;
            const particlePositions = new Float32Array(particleCount * 3);
            particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
            
            for (let i = 0; i < POOL_SIZES.hitEffects; i++) {
                const particleMaterial = new THREE.PointsMaterial({
                    color: 0xff4655,
                    size: 0.1,
                    transparent: true,
                    opacity: 0.8
                });
                
                const particles = new THREE.Points(particleGeometry.clone(), particleMaterial);
                particles.visible = false;
                scene.add(particles);
                
                objectPools.hitEffects.push({
                    object: particles,
                    inUse: false,
                    releaseTime: 0,
                    velocities: new Array(particleCount).fill(0).map(() => ({
                        x: 0, y: 0, z: 0
                    })),
                    frameCount: 0
                });
            }
            
            // Bullet impact decals pool
            for (let i = 0; i < POOL_SIZES.bulletImpacts; i++) {
                const decalGeometry = new THREE.CircleGeometry(0.1, 8);
                const decalMaterial = new THREE.MeshBasicMaterial({
                    color: 0x333333,
                    transparent: true,
                    opacity: 0.8,
                    depthWrite: false
                });
                
                const decal = new THREE.Mesh(decalGeometry, decalMaterial);
                decal.visible = false;
                scene.add(decal);
                objectPools.bulletImpacts.push({
                    object: decal,
                    inUse: false,
                    releaseTime: 0
                });
            }
        }
        
        // Get an object from pool
        function getFromPool(poolName) {
            const pool = objectPools[poolName];
            
            // Find an unused object
            for (let i = 0; i < pool.length; i++) {
                if (!pool[i].inUse) {
                    pool[i].inUse = true;
                    pool[i].object.visible = true;
                    return pool[i];
                }
            }
            
            // If no free objects, reuse the oldest one
            let oldest = pool[0];
            for (let i = 1; i < pool.length; i++) {
                if (pool[i].releaseTime < oldest.releaseTime) {
                    oldest = pool[i];
                }
            }
            
            oldest.inUse = true;
            oldest.object.visible = true;
            return oldest;
        }
        
        // Release object back to pool
        function releaseToPool(poolItem, poolName) {
            poolItem.inUse = false;
            poolItem.object.visible = false;
            poolItem.releaseTime = performance.now();
        }

            };

        // Targets
        function createTarget(x, y, z, type = 'standard') {
            // Target base model - Use simplified geometry for better performance
            const segmentCount = adaptiveSettings.currentQuality === 'low' ? 16 : 32;
            
            const targetGeometry = type === 'standard' 
                ? new THREE.CylinderGeometry(1, 1, 0.1, segmentCount) 
                : new THREE.BoxGeometry(2, 2, 0.1);
            
            const targetMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xff4655,
                roughness: 0.5,
                metalness: 0.7,
                emissive: 0xff4655,
                emissiveIntensity: 0.2
            });
            
            const target = new THREE.Mesh(targetGeometry, targetMaterial);
            target.position.set(x, y, z);
            
            // Rotate to face player
            if (type === 'standard') {
                target.rotation.x = Math.PI / 2;
            } else {
                // Calculate direction to center (0,0,0)
                const dx = -x;
                const dz = -z;
                const angle = Math.atan2(dx, dz);
                target.rotation.y = angle;
            }
            
            target.castShadow = true;
            target.receiveShadow = true;
            
            // Tag as dynamic for spatial partitioning
            target.userData = {
                dynamic: true,
                originalGeometryType: type === 'standard' ? 'Cylinder' : 'Box'
            };
            
            scene.add(target);
            
            // Add inner rings for standard targets (simplified for performance)
            if (type === 'standard' && adaptiveSettings.currentQuality !== 'low') {
                const innerRings = [];
                
                // Middle ring
                const middleRing = new THREE.Mesh(
                    new THREE.RingGeometry(0.6, 0.7, segmentCount),
                    new THREE.MeshBasicMaterial({ 
                        color: 0xffffff,
                        side: THREE.DoubleSide
                    })
                );
                middleRing.position.set(0, 0.06, 0);
                middleRing.rotation.x = Math.PI / 2;
                target.add(middleRing);
                innerRings.push(middleRing);
                
                // Inner ring
                const innerRing = new THREE.Mesh(
                    new THREE.RingGeometry(0.3, 0.4, segmentCount),
                    new THREE.MeshBasicMaterial({ 
                        color: 0xffffff,
                        side: THREE.DoubleSide
                    })
                );
                innerRing.position.set(0, 0.06, 0);
                innerRing.rotation.x = Math.PI / 2;
                target.add(innerRing);
                innerRings.push(innerRing);
                
                // Bullseye
                const bullseye = new THREE.Mesh(
                    new THREE.CircleGeometry(0.2, segmentCount),
                    new THREE.MeshBasicMaterial({ 
                        color: 0xffffff,
                        side: THREE.DoubleSide
                    })
                );
                bullseye.position.set(0, 0.06, 0);
                bullseye.rotation.x = Math.PI / 2;
                target.add(bullseye);
                innerRings.push(bullseye);
            } else if (type === 'box') {
                // For box targets, add a simplified crosshair pattern
                const horizontalLine = new THREE.Mesh(
                    new THREE.BoxGeometry(1.5, 0.1, 0.01),
                    new THREE.MeshBasicMaterial({ color: 0xffffff })
                );
                horizontalLine.position.z = 0.06;
                target.add(horizontalLine);
                
                const verticalLine = new THREE.Mesh(
                    new THREE.BoxGeometry(0.1, 1.5, 0.01),
                    new THREE.MeshBasicMaterial({ color: 0xffffff })
                );
                verticalLine.position.z = 0.06;
                target.add(verticalLine);
                
                const centerDot = new THREE.Mesh(
                    new THREE.CircleGeometry(0.2, 8),
                    new THREE.MeshBasicMaterial({ color: 0xffffff })
                );
                centerDot.position.z = 0.07;
                centerDot.rotation.x = Math.PI / 2;
                target.add(centerDot);
            }
            
            // Store target data
            const targetData = {
                mesh: target,
                initialPosition: { x, y, z },
                hit: false,
                hitTime: 0,
                value: type === 'standard' ? 100 : 150,
                type: type,
                health: type === 'standard' ? 1 : 3
            };
            
            targetObjects.push(targetData);
            spatialGrid.addObject(target);
            
            return targetData;
        }

        // Create a moving target
        function createMovingTarget() {
            // Random start position
            const angle = Math.random() * Math.PI * 2;
            const distance = 20 + Math.random() * 20;
            const x = Math.sin(angle) * distance;
            const z = Math.cos(angle) * distance;
            const y = 3 + Math.random() * 5;
            
            // Create the target
            const target = createTarget(x, y, z, 'standard');
            
            // Add movement data
            target.moveData = {
                startPos: { x, y, z },
                amplitude: 5 + Math.random() * 5,
                speed: 0.5 + Math.random(),
                direction: Math.random() > 0.5 ? 'horizontal' : 'vertical',
                phase: Math.random() * Math.PI * 2
            };
            
            return target;
        }

                const rect = joystickContainer.getBoundingClientRect();
                joystickOrigin = {
                    x: rect.left + rect.width / 2,
                    y: rect.top + rect.height / 2
                };
                updateJoystickPosition(touch.clientX, touch.clientY);
            });
            
            joystickContainer.addEventListener('touchmove', (e) => {
                if (!joystickActive) return;
                e.preventDefault();
                const touch = e.touches[0];

                game.keys.s = false;
                game.keys.d = false;

            function updateJoystickPosition(touchX, touchY) {
                // Calculate distance from center
                const dx = touchX - joystickOrigin.x;
                const dy = touchY - joystickOrigin.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                // Limit distance to joystick container radius
                const maxDistance = 50;
                const limitedDistance = Math.min(distance, maxDistance);
                
                // Calculate joystick position
                const angle = Math.atan2(dy, dx);
                const x = Math.cos(angle) * limitedDistance;
                const y = Math.sin(angle) * limitedDistance;
                
                // Update joystick visual position
                joystick.
// Update joystick visual position
                joystick.style.transform = `translate(${x}px, ${y}px)`;
                
                // Update movement keys based on joystick position
                const deadzone = 10;
                
                // Set movement keys
                game.keys.w = y < -deadzone;
                game.keys.s = y > deadzone;
                game.keys.a = x < -deadzone;
                game.keys.d = x > deadzone;
            }
            
            function resetJoystick() {
                joystick.style.transform = 'translate(0px, 0px)';
            }
            
            // Look area handlers
            let lookActive = false;
            let previousTouchX = 0;
            let previousTouchY = 0;
            
            lookArea.addEventListener('touchstart', (e) => {
                lookActive = true;
                const touch = e.touches[0];
                previousTouchX = touch.clientX;
                previousTouchY = touch.clientY;
            });
            
            lookArea.addEventListener('touchmove', (e) => {
                if (!lookActive) return;
                const touch = e.touches[0];
                
                // Calculate movement delta
                const movementX = touch.clientX - previousTouchX;
                const movementY = touch.clientY - previousTouchY;
                
                // Create a synthetic mouse movement event
                const syntheticEvent = {
                    movementX: movementX,
                    movementY: movementY
                };
                
                // Process with regular mouse handling
                mouseLookController.handleMouseMove(syntheticEvent);
                
                // Update for next move
                previousTouchX = touch.clientX;
                previousTouchY = touch.clientY;
            });
            
            lookArea.addEventListener('touchend', () => {
                lookActive = false;
            });
            
            // Button event handlers
            shootButton.addEventListener('touchstart', (e) => {
                e.preventDefault();
                game.mouseDown = true;
                shoot();
                
                // For automatic weapons, setup interval for continuous fire
                const weapon = game.weapons[game.activeWeapon];
                if (weapon.automatic && game.autoShootInterval === null) {
                    game.autoShootInterval = setInterval(() => {
                        if (game.mouseDown) {
                            shoot();
                        }
                    }, weapon.fireRate);
                }
            });

                e.preventDefault();

                // Clear auto-shoot interval
                if (game.autoShootInterval !== null) {
                    clearInterval(game.autoShootInterval);

        // Weapon bobbing when walking
        function applyWeaponBobbing(time, isMoving) {
            const activeWeapon = game.weapons[game.activeWeapon].model;
            if (!activeWeapon) return;
            
            // Get movement magnitude for bob intensity
            const moveX = game.keys.a || game.keys.d ? 1 : 0;
            const moveZ = game.keys.w || game.keys.s ? 1 : 0;
            const moveMagnitude = Math.min(Math.sqrt(moveX * moveX + moveZ * moveZ), 1);
            
            if (isMoving && moveMagnitude > 0) {
                const bobbingSpeed = characterController.sprinting ? 12 : 8;
                const bobbingAmount = characterController.sprinting ? 0.02 : 0.01;
                
                // More natural bobbing curve
                const verticalBob = Math.sin(time * 0.01 * bobbingSpeed) * bobbingAmount * moveMagnitude;
                const horizontalBob = Math.cos(time * 0.005 * bobbingSpeed) * bobbingAmount * 0.5 * moveMagnitude;
                
                // Smooth transition to bobbing position
                activeWeapon.position.y = THREE.MathUtils.lerp(activeWeapon.position.y, -0.3 + verticalBob, 0.2);
                activeWeapon.position.x = THREE.MathUtils.lerp(activeWeapon.position.x, 0.3 + horizontalBob, 0.2);
                
                // Slight weapon tilt when moving
                const tiltAmount = 0.03 * moveMagnitude;
                activeWeapon.rotation.z = THREE.MathUtils.lerp(activeWeapon.rotation.z, 
                    (game.keys.a ? tiltAmount : game.keys.d ? -tiltAmount : 0), 0.1);
            } else {
                // Smoothly return to idle position
                activeWeapon.position.y = THREE.MathUtils.lerp(activeWeapon.position.y, -0.3, 0.1);
                activeWeapon.position.x = THREE.MathUtils.lerp(activeWeapon.position.x, 0.3, 0.1);
                activeWeapon.rotation.z = THREE.MathUtils.lerp(activeWeapon.rotation.z, 0, 0.1);
            }
        }
