        // Optimized shoot function using spatial partitioning
        function shoot() {
            if (game.reloading) return;
            
            const weapon = game.weapons[game.activeWeapon];
            
            // Check if we have ammo
            if (weapon.ammo <= 0) {
                showNotification("Out of ammo! Press R to reload");
                
                // Attempt auto-reload
                if (!game.reloading) {
                    reload();
                }
                return;
            }
            
            // Check fire rate
            const now = Date.now();
            if (now - game.lastShot < weapon.fireRate) {
                return;
            }
            game.lastShot = now;
            
            // Decrease ammo
            weapon.ammo--;
            ammoValue.textContent = weapon.ammo;
            
            // Show muzzle flash
            if (weapon.muzzleFlash) {
                weapon.muzzleFlash.material.opacity = 1;
                setTimeout(() => {
                    weapon.muzzleFlash.material.opacity = 0;
                }, 50);
            }
            
            // Apply recoil to weapon
            const recoilAmount = weapon.recoil * (Math.random() * 0.5 + 0.75);
            weapon.model.rotation.x = Math.PI + recoilAmount;
            weapon.model.position.y = -0.3 - recoilAmount * 5;
            
            // Gradually recover from recoil
            setTimeout(() => {
                weapon.model.rotation.x = Math.PI;
                weapon.model.position.y = -0.3;
            }, 200);
            
            // Create raycast from camera
            raycaster.setFromCamera(mouse, camera);
            
            // Add spread to raycast direction
            const spread = weapon.spread * (characterController.sprinting ? 2 : 1);
            const spreadX = (Math.random() - 0.5) * spread;
            const spreadY = (Math.random() - 0.5) * spread;
            raycaster.ray.direction.x += spreadX;
            raycaster.ray.direction.y += spreadY;
            raycaster.ray.direction.normalize();
            
            // Create bullet trail effect
            createBulletTrail(raycaster.ray.origin, raycaster.ray.direction);
            
            // Optimize hit detection by only checking objects in the path
            const rayDirection = raycaster.ray.direction.clone();
            const rayStart = raycaster.ray.origin.clone();
            const rayEnd = rayDirection.clone().multiplyScalar(100).add(rayStart);
            
            // Get objects near the ray path
            const nearbyObjects = [];
            
            // Sample points along the ray to find relevant grid cells
            const sampleCount = 5;
            for (let i = 0; i < sampleCount; i++) {
                const t = i / (sampleCount - 1);
                const sampleX = rayStart.x + (rayEnd.x - rayStart.x) * t;
                const sampleZ = rayStart.z + (rayEnd.z - rayStart.z) * t;
                
                // Get objects from this grid cell
                const cellObjects = spatialGrid.getNearbyObjects(sampleX, sampleZ, 5);
                
                // Add unique objects to the list
                for (const obj of cellObjects) {
                    if (!nearbyObjects.includes(obj)) {
                        nearbyObjects.push(obj);
                    }
                }
            }
            
            // Raycast only against nearby objects
            const intersects = raycaster.intersectObjects(nearbyObjects, true);
            
            let hitSomething = false;
            
            // Check hits with targets
            for (let i = 0; i < intersects.length; i++) {
                const object = intersects[i].object;
                
                // Check if it's a target or part of a target
                for (let j = 0; j < targetObjects.length; j++) {
                    const target = targetObjects[j];
                    
                    if (!target.hit && (object === target.mesh || object.parent === target.mesh)) {
                        // Handle hit on target
                        hitSomething = true;
                        target.health -= weapon.damage;
                        
                        // Create hit effect
                        createHitEffect(intersects[i].point);
                        
                        if (target.health <= 0) {
                            // Target destroyed
                            target.hit = true;
                            target.hitTime = now;
                            
                            // Change color to indicate hit
                            if (object.material) {
                                object.material.color.set(0x00ff00);
                                if (object.material.emissive) {
                                    object.material.emissive.set(0x00ff00);
                                }
                            } else if (object.parent && object.parent.material) {
                                object.parent.material.color.set(0x00ff00);
                                if (object.parent.material.emissive) {
                                    object.parent.material.emissive.set(0x00ff00);
                                }
                            }
                            
                            // Add score
                            game.score += target.value;
                            scoreValue.textContent = game.score;
                            
                            // Show hit marker
                            showHitMarker();
                            
                            // Add to kill feed
                            addKillFeedMessage("Target", target.type);
                            
                            // Start falling animation
                            animateTargetHit(target);
                            
                            // Respawn target after delay
                            setTimeout(() => {
                                respawnTarget(target);
                            }, 5000);
                        } else {
                            // Target hit but not destroyed
                            showHitMarker();
                            
                            // Visual feedback for hit
                            if (object.material) {
                                const originalColor = object.material.color.clone();
                                object.material.color.set(0xffaa00);
                                
                                setTimeout(() => {
                                    object.material.color.copy(originalColor);
                                }, 100);
                            }
                        }
                        
                        break;
                    }
                }
                
                // Check if it's an enemy
                for (let j = 0; j < enemyObjects.length; j++) {
                    const enemy = enemyObjects[j];
                    
                    if (!enemy.hit && enemy.isActive && (object.parent === enemy.mesh || enemy.mesh.children.includes(object))) {
                        // Handle hit on enemy
                        hitSomething = true;
                        enemy.health -= weapon.damage;
                        
                        // Create hit effect
                        createHitEffect(intersects[i].point);
                        
                        // Show hit marker
                        showHitMarker();
                        
                        if (enemy.health <= 0) {
                            // Enemy defeated
                            enemy.hit = true;
                            enemy.hitTime = now;
                            enemy.isActive = false;
                            
                            // Add score
                            game.score += enemy.value;
                            scoreValue.textContent = game.score;
                            
                            // Add to kill feed
                            addKillFeedMessage("Enemy", "defeated");
                            
                            // Start death animation
                            animateEnemyDeath(enemy);
                            
                            // Respawn enemy after delay
                            setTimeout(() => {
                                respawnEnemy(enemy);
                            }, 10000);
                        } else {
                            // Enemy hit but not defeated
                            // Visual feedback for hit
                            enemy.mesh.children.forEach(part => {
                                if (part.material) {
                                    const originalColor = part.material.color.clone();
                                    part.material.color.set(0xffaa00);
                                    
                                    setTimeout(() => {
                                        part.material.color.copy(originalColor);
                                    }, 100);
                                }
                            });
                        }
                        
                        break;
                    }
                }
                
                // Check for hits with environment objects
                if (!hitSomething && objects.includes(object)) {
                    // Hit environment object
                    createHitEffect(intersects[i].point, true);
                    createBulletImpact(intersects[i].point, intersects[i].face.normal);
                    break;
                }
            }
        }
        
        // Create bullet trail effect using object pool
        function createBulletTrail(startPoint, direction) {
            const poolItem = getFromPool('bulletTrails');
            const trail = poolItem.object;
            
            // Calculate endpoint
            const trailLength = adaptiveSettings.currentQuality === 'low' ? 30 : 50;
            const endPoint = new THREE.Vector3()
                .copy(direction)
                .multiplyScalar(trailLength)
                .add(startPoint);
            
            // Update positions
            const positions = trail.geometry.attributes.position.array;
            positions[0] = startPoint.x;
            positions[1] = startPoint.y;
            positions[2] = startPoint.z;
            positions[3] = endPoint.x;
            positions[4] = endPoint.y;
            positions[5] = endPoint.z;
            
            trail.geometry.attributes.position.needsUpdate = true;
            
            // Auto-release after short time
            setTimeout(() => {
                releaseToPool(poolItem, 'bulletTrails');
            }, 100);
        }
        
        // Create hit effect using object pool
        function createHitEffect(position, isWall = false) {
            const poolItem = getFromPool('hitEffects');
            const particles = poolItem.object;
            
            // Reset frame count
            poolItem.frameCount = 0;
            
            // Set color based on hit type
            particles.material.color.set(isWall ? 0xcccccc : 0xff4655);
            
            // Set initial positions
            const positions = particles.geometry.attributes.position.array;
            const particleCount = Math.min(adaptiveSettings.maxParticles, positions.length / 3);
            
            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = position.x;
                positions[i * 3 + 1] = position.y;
                positions[i * 3 + 2] = position.z;
                
                // Initialize velocities
                poolItem.velocities[i] = {
                    x: (Math.random() - 0.5) * 0.1,
                    y: (Math.random() - 0.5) * 0.1 + 0.05,
                    z: (Math.random() - 0.5) * 0.1
                };
            }
            
            particles.geometry.attributes.position.needsUpdate = true;
            
            // Update function to animate particles
            function updateHitEffect() {
                poolItem.frameCount++;
                
                if (poolItem.frameCount > 60 || !poolItem.inUse) {
                    releaseToPool(poolItem, 'hitEffects');
                    return;
                }
                
                const positions = particles.geometry.attributes.position.array;
                
                for (let i = 0; i < particleCount; i++) {
                    // Apply velocity
                    positions[i * 3] += poolItem.velocities[i].x;
                    positions[i * 3 + 1] += poolItem.velocities[i].y;
                    positions[i * 3 + 2] += poolItem.velocities[i].z;
                    
                    // Apply gravity
                    poolItem.velocities[i].y -= 0.002;
                }
                
                particles.geometry.attributes.position.needsUpdate = true;
                
                // Fade out
                particles.material.opacity = 0.8 * (1 - poolItem.frameCount / 60);
                
                // Request another update
                requestAnimationFrame(updateHitEffect);
            }
            
            // Start animation
            updateHitEffect();
        }
        
        // Create bullet impact using object pool
        function createBulletImpact(position, normal) {
            // Skip if quality is low or we have too many already
            if (adaptiveSettings.currentQuality === 'low' && Math.random() > 0.3) {
                return;
            }
            
            const poolItem = getFromPool('bulletImpacts');
            const decal = poolItem.object;
            
            // Position the decal
            decal.position.copy(position);
            
            // Orient based on surface normal
            decal.lookAt(
                position.x + normal.x,
                position.y + normal.y,
                position.z + normal.z
            );
            
            // Offset slightly to prevent z-fighting
            decal.position.add(normal.clone().multiplyScalar(0.01));
            
            // Add to active decals list for cleanup management
            adaptiveSettings.activeDecals.push(decal);
            
            // Fade out over time
            setTimeout(() => {
                let opacity = 0.8;
                const fadeInterval = setInterval(() => {
                    opacity -= 0.05;
                    decal.material.opacity = opacity;
                    
                    if (opacity <= 0 || !poolItem.inUse) {
                        clearInterval(fadeInterval);
                        releaseToPool(poolItem, 'bulletImpacts');
                    }
                }, 200);
            }, 5000); // Start fading after 5 seconds instead of 10
        }

        // Animate target hit
        function animateTargetHit(target) {
            if (target.type === 'standard') {
                // Cylinder target falls over
                let fallSpeed = 0;
                let rotationSpeed = Math.random() * 0.05 - 0.025;
                
                function fall() {
                    if (!target.mesh.parent) return; // Target was removed
                    
                    fallSpeed += 0.01;
                    target.mesh.position.y -= fallSpeed;
                    target.mesh.rotation.z += rotationSpeed;
                    
                    if (target.mesh.position.y > -10) {
                        requestAnimationFrame(fall);
                    } else {
                        scene.remove(target.mesh);
                    }
                }
                
                fall();
            } else {
                // Box target flips backward
                let rotationSpeed = 0;
                const maxRotationSpeed = 0.1;
                
                function flip() {
                    if (!target.mesh.parent) return; // Target was removed
                    
                    rotationSpeed = Math.min(rotationSpeed + 0.002, maxRotationSpeed);
                    target.mesh.rotation.x += rotationSpeed;
                    target.mesh.position.y -= 0.01;
                    
                    if (target.mesh.rotation.x < Math.PI * 2) {
                        requestAnimationFrame(flip);
                    } else {
                        scene.remove(target.mesh);
                    }
                }
                
                flip();
            }
        }
        
        // Animate enemy death
        function animateEnemyDeath(enemy) {
            // Make enemy fall to the ground
            let fallSpeed = 0;
            let rotationSpeed = Math.random() * 0.05 - 0.025;
            
            function fall() {
                if (!enemy.mesh.parent) return; // Enemy was removed
                
                fallSpeed += 0.01;
                enemy.mesh.position.y -= fallSpeed;
                enemy.mesh.rotation.z += rotationSpeed;
                
                if (enemy.mesh.position.y > -10) {
                    requestAnimationFrame(fall);
                } else {
                    scene.remove(enemy.mesh);
                }
            }
            
            fall();
        }
        
        // Respawn target
        function respawnTarget(target) {
            // Remove old target if it still exists
            if (target.mesh.parent) {
                scene.remove(target.mesh);
                spatialGrid.removeObject(target.mesh);
            }
            
            // Create a new random position
            const angle = Math.random() * Math.PI * 2;
            const distance = 20 + Math.random() * 20;
            const x = Math.sin(angle) * distance;
            const z = Math.cos(angle) * distance;
            const y = 3 + Math.random() * 5;
            
            // Create a new target of the same type
            const newTarget = createTarget(x, y, z, target.type);
            
            // If it was a moving target, add movement data
            if (target.moveData) {
                newTarget.moveData = {
                    startPos: { x, y, z },
                    amplitude: 5 + Math.random() * 5,
                    speed: 0.5 + Math.random(),
                    direction: Math.random() > 0.5 ? 'horizontal' : 'vertical',
                    phase: Math.random() * Math.PI * 2
                };
            }
            
            // Remove the old target from the array
            const index = targetObjects.indexOf(target);
            if (index !== -1) {
                targetObjects.splice(index, 1);
            }
        }
        
        // Respawn enemy
        function respawnEnemy(enemy) {
            // Remove old enemy if it still exists
            if (enemy.mesh.parent) {
                scene.remove(enemy.mesh);
                spatialGrid.removeObject(enemy.mesh);
            }
            
            // Create a new random position
            const angle = Math.random() * Math.PI * 2;
            const distance = 30 + Math.random() * 15;
            const x = Math.sin(angle) * distance;
            const z = Math.cos(angle) * distance;
            
            // Create a new enemy
            const newEnemy = createEnemy(x, 0, z);
            
            // Remove the old enemy from the array
            const index = enemyObjects.indexOf(enemy);
            if (index !== -1) {
                enemyObjects.splice(index, 1);
            }
        }
        
        // Reload function
        function reload() {
            const weapon = game.weapons[game.activeWeapon];
            
            // Check if reload is needed
            if (game.reloading || weapon.ammo === weapon.maxAmmo) return;
            
            game.reloading = true;
            
            // Show reload indicator
            reloadIndicator.style.opacity = "1";
            reloadProgress.style.width = "0%";
            reloadProgress.style.transition = `width ${weapon.reloadTime}s linear`;
            
            // Start reload progress
            setTimeout(() => {
                reloadProgress.style.width = "100%";
            }, 50);
            
            // Show notification
            showNotification(`Reloading ${weapon.name}...`);
            
            // Reload animation
            const weaponModel = weapon.model;
            
            // Different reload animations depending on weapon
            if (game.activeWeapon === 'rifle') {
                // Rifle reload animation
                weaponModel.position.y = -0.1;
                weaponModel.rotation.x = Math.PI - 0.3;
                weaponModel.rotation.z = 0.5;
                
                setTimeout(() => {
                    // Magazine out
                    const magazine = weaponModel.children.find(c => c.position.y === -0.12 && c.position.z === 0.1);
                    if (magazine) {
                        magazine.position.y = -0.4;
                    }
                    
                    setTimeout(() => {
                        // Magazine in
                        if (magazine) {
                            magazine.position.y = -0.12;
                        }
                        
                        setTimeout(() => {
                            // Finish reload
                            weaponModel.position.y = -0.3;
                            weaponModel.rotation.x = Math.PI;
                            weaponModel.rotation.z = 0;
                        }, weapon.reloadTime * 1000 * 0.3);
                    }, weapon.reloadTime * 1000 * 0.4);
                }, weapon.reloadTime * 1000 * 0.2);
            } else if (game.activeWeapon === 'sniper') {
                // Sniper reload animation - pull bolt and load rounds
                weaponModel.position.y = -0.1;
                
                setTimeout(() => {
                    weaponModel.rotation.z = 0.2;
                    
                    setTimeout(() => {
                        weaponModel.rotation.z = -0.2;
                        
                        setTimeout(() => {
                            // Finish reload
                            weaponModel.position.y = -0.3;
                            weaponModel.rotation.z = 0;
                        }, weapon.reloadTime * 1000 * 0.3);
                    }, weapon.reloadTime * 1000 * 0.4);
                }, weapon.reloadTime * 1000 * 0.2);
            }
            
            // Complete reload after specified time
            setTimeout(() => {
                // Hide reload indicator
                reloadIndicator.style.opacity = "0";
                
                // Refill ammo
                weapon.ammo = weapon.maxAmmo;
                ammoValue.textContent = weapon.ammo;
                
                // Reset reloading state
                game.reloading = false;
                
                // Show notification
                showNotification("Reload complete");
            }, weapon.reloadTime * 1000);
        }
        
        // Show notification
        function showNotification(text, duration = 2000) {
            notification.textContent = text;
            notification.style.opacity = "1";
            
            setTimeout(() => {
                notification.style.opacity = "0";
            }, duration);
        }
        
        // Take damage function for player
        function takeDamage(amount) {
            game.health = Math.max(0, game.health - amount);
            
            // Update health display
            healthFill.style.width = `${game.health}%`;
            healthValue.textContent = game.health;
            
            // Show damage indicator
            damageIndicator.style.opacity = "0.8";
            setTimeout(() => {
                damageIndicator.style.opacity = "0";
            }, 300);
            
            // Check for game over
            if (game.health <= 0) {
                // Implement game over logic here
                showNotification("GAME OVER", 5000);
                
                // Reset player after 3 seconds
                setTimeout(() => {
                    game.health = 100;
                    healthFill.style.width = "100%";
                    healthValue.textContent = 100;
                    characterController.reset();
                    showNotification("Respawned!", 2000);
                }, 3000);
            }
        }
        
        // Update moving targets
        function updateMovingTargets(time) {
            for (const target of targetObjects) {
                if (target.hit || !target.moveData) continue;
                
                // Check distance to player for optimization
                const distanceToPlayer = characterController.position.distanceTo(
                    new THREE.Vector3(
                        target.mesh.position.x,
                        target.mesh.position.y,
                        target.mesh.position.z
                    )
                );
                
                // Skip updating distant targets
                if (distanceToPlayer > adaptiveSettings.drawDistance) {
                    target.mesh.visible = false;
                    continue;
                } else {
                    target.mesh.visible = true;
                }
                
                const moveData = target.moveData;
                
                // Calculate new position based on movement pattern
                if (moveData.direction === 'horizontal') {
                    target.mesh.position.x = moveData.startPos.x + 
                        Math.sin(time * 0.001 * moveData.speed + moveData.phase) * moveData.amplitude;
                } else {
                    target.mesh.position.y = moveData.startPos.y + 
                        Math.sin(time * 0.001 * moveData.speed + moveData.phase) * moveData.amplitude * 0.5;
                }
                
                // Update position in spatial grid
                spatialGrid.updateObject(target.mesh);
            }
        }
        
        // Update enemies
        function updateEnemies(time) {
            const now = Date.now();
            const playerPosition = characterController.position;
            
            for (const enemy of enemyObjects) {
                if (enemy.hit || !enemy.isActive) continue;
                
                // Calculate distance to player
                const distanceToPlayer = playerPosition.distanceTo(
                    new THREE.Vector3(
                        enemy.mesh.position.x,
                        enemy.mesh.position.y,
                        enemy.mesh.position.z
                    )
                );
                
                // Skip updating distant enemies
                if (distanceToPlayer > adaptiveSettings.drawDistance) {
                    enemy.mesh.visible = false;
                    continue;
                } else {
                    enemy.mesh.visible = true;
                }
                
                // Update frequency based on distance
                // Close enemies update every frame, distant ones less frequently
                if (distanceToPlayer > 20 && time % 3 !== 0) {
                    continue;
                }
                
                // Enemy behavior based on distance
                if (distanceToPlayer < 30) {
                    // Calculate direction to player
                    const dx = playerPosition.x - enemy.mesh.position.x;
                    const dz = playerPosition.z - enemy.mesh.position.z;
                    
                    // Enemy can see player - turn towards player
                    const targetAngle = Math.atan2(dx, dz);
                    
                    // Smoothly rotate towards player
                    enemy.mesh.rotation.y = THREE.MathUtils.lerp(
                        enemy.mesh.rotation.y,
                        targetAngle,
                        0.05
                    );
                    
                    // After a delay, shoot at player
                    if (distanceToPlayer < 20 && now - enemy.lastShot > enemy.shotDelay) {
                        enemy.lastShot = now;
                        
                        // Enemy shoots at player
                        enemyShoot(enemy);
                    }
                    
                    // Move towards player if not too close
                    if (distanceToPlayer > 15) {
                        const moveSpeed = 0.05;
                        const normalizedDx = dx / distanceToPlayer;
                        const normalizedDz = dz / distanceToPlayer;
                        enemy.mesh.position.x += normalizedDx * moveSpeed;
                        enemy.mesh.position.z += normalizedDz * moveSpeed;
                    } else if (distanceToPlayer < 10) {
                        // Back away if too close
                        const moveSpeed = 0.03;
                        const normalizedDx = dx / distanceToPlayer;
                        const normalizedDz = dz / distanceToPlayer;
                        enemy.mesh.position.x -= normalizedDx * moveSpeed;
                        enemy.mesh.position.z -= normalizedDz * moveSpeed;
                    }
                } else {
                    // Patrol movement when player is far away
                    const patrolSpeed = 0.01;
                    const patrolRadius = 5;
                    const patrolTime = time * 0.0005;
                    
                    enemy.mesh.position.x = enemy.position.x + Math.sin(patrolTime) * patrolRadius;
                    enemy.mesh.position.z = enemy.position.z + Math.cos(patrolTime) * patrolRadius;
                    
                    // Update rotation to match movement direction
                    if (time % 5 === 0) { // Only update rotation every few frames
                        enemy.mesh.rotation.y = Math.atan2(
                            Math.cos(patrolTime),
                            -Math.sin(patrolTime)
                        );
                    }
                }
                
                // Update position in spatial grid
                spatialGrid.updateObject(enemy.mesh);
            }
        }
        
        // Enemy shoots at player
        function enemyShoot(enemy) {
            // Skip shots on low quality or very low FPS
            if (adaptiveSettings.currentQuality === 'low' && Math.random() > 0.7) {
                return;
            }
            
            // Calculate direction to player
            const dirX = characterController.position.x - enemy.mesh.position.x;
            const dirY = characterController.position.y - enemy.mesh.position.y - 0.5;
            const dirZ = characterController.position.z - enemy.mesh.position.z;
            
            const length = Math.sqrt(dirX * dirX + dirY * dirY + dirZ * dirZ);
            
            // Visual effect for enemy shooting
            const muzzlePos = new THREE.Vector3(
                enemy.mesh.position.x + dirX / length * 1.2,
                enemy.mesh.position.y + 1.1,
                enemy.mesh.position.z + dirZ / length * 1.2
            );
            
            // Create muzzle flash for enemy (use object pool if available)
            const muzzleFlash = new THREE.PointLight(0xffcc00, 2, 5);
            muzzleFlash.position.copy(muzzlePos);
            scene.add(muzzleFlash);
            
            // Create bullet trail from enemy (using pool)
            const direction = new THREE.Vector3(dirX, dirY, dirZ).normalize();
            createBulletTrail(muzzlePos, direction);
            
            // Chance to hit player based on distance
            const distance = length;
            const hitChance = Math.max(0.1, 0.9 - distance * 0.02);
            
            if (Math.random() < hitChance) {
                // Player takes damage - more damage if closer
                const damage = Math.max(5, Math.floor(20 - distance * 0.3));
                takeDamage(damage);
            }
            
            // Clean up effects
            setTimeout(() => {
                scene.remove(muzzleFlash);
            }, 100);
        }
        
        // Update function using character controller
        function updateGameState(delta) {
            // Update character controller
            characterController.update(delta);
            
            // Update weapon position to follow camera
            updateWeaponPosition();
            
            // Apply weapon bobbing
            const isMoving = game.keys.w || game.keys.a || game.keys.s || game.keys.d;
            const time = performance.now();
            applyWeaponBobbing(time, isMoving);
            
            // Update spatial grid with new object positions
            updateSpatialGrid();
        }
        
        // Update only visible and nearby objects
        function updateVisibleObjects(time, delta) {
            const playerPosition = characterController.position;
            
            // Update moving targets
            updateMovingTargets(time);
            
            // Update enemies with LOD based on distance
            updateEnemies(time);
            
            // Update decals - fade out older ones when we have too many
            if (adaptiveSettings.activeDecals.length > adaptiveSettings.maxDecals) {
                const oldestDecal = adaptiveSettings.activeDecals.shift();
                if (oldestDecal && oldestDecal.parent) {
                    scene.remove(oldestDecal);
                    if (oldestDecal.geometry) oldestDecal.geometry.dispose();
                    if (oldestDecal.material) oldestDecal.material.dispose();
                }
            }
        }
        
        // Update spatial grid
        function updateSpatialGrid() {
            // Update positions of dynamic objects in the grid
            for (const target of targetObjects) {
                if (target.mesh && target.mesh.userData && target.mesh.userData.dynamic) {
                    spatialGrid.updateObject(target.mesh);
                }
            }
            
            for (const enemy of enemyObjects) {
                if (enemy.mesh && enemy.mesh.userData && enemy.mesh.userData.dynamic) {
                    spatialGrid.updateObject(enemy.mesh);
                }
            }
        }
        
        // Update weapon position relative to camera
        function updateWeaponPosition() {
            // Position weapon relative to camera
            weaponGroup.position.copy(camera.position);
            
            // Match weapon rotation to camera view with smoother transitions
            weaponGroup.rotation.y = camera.rotation.y;
            weaponGroup.rotation.x = camera.rotation.x;
            
            // Add slight angle to make the weapon appear more natural
            weaponGroup.rotation.z = THREE.MathUtils.lerp(
                weaponGroup.rotation.z,
                0, // Target rotation
                0.2 // Smoothing factor
            );
        }
        
        // Initialize controllers and game
        function initializeControllers() {
            characterController.init();
            mouseLookController.init();
        }
        
        // Initialize the optimized game
        function initGame() {
            // Initialize adaptive quality system
            initializeAdaptiveQuality();
            
            // Initialize spatial partitioning
            spatialGrid.init();
            
            // Create the map
            createMap();
            
            // Create weapons
            createWeapons();
            
            // Initialize object pools
            initObjectPools();
            
            // Spawn targets
            spawnTargets();
            
            // Spawn enemies
            spawnEnemies();
            
            // Initialize character and camera controllers
            initializeControllers();
            
            // Add objects to spatial grid
            for (const object of objects) {
                spatialGrid.addObject(object);
            }
            
            // Setup mobile controls if needed
            if (deviceInfo.touchEnabled) {
                setupMobileControls();
            }
            
            // Initial weapon setup
            switchWeapon('rifle');
            
            // Show welcome message
            if (deviceInfo.touchEnabled) {
                showNotification("Welcome! Use left joystick to move and right area to look around.", 5000);
            } else {
                showNotification("Welcome to Valorant FPS! Use WASD to move, mouse to aim, left click to shoot.", 5000);
                setTimeout(() => {
                    showNotification("Press O to toggle quality, H for emergency reset", 4000);
                }, 5500);
            }
        }
        
        // Animation loop with performance optimizations
        let prevTime = performance.now();
        let frameCount = 0;
        let lastFpsUpdate = prevTime;
        let fps = 0;
        
        // Animation loop with frame time throttling and adaptive quality
        function animate(time) {
            requestAnimationFrame(animate);
            
            // Calculate delta time
            const delta = Math.min((time - prevTime) / 1000, 0.1); // Cap delta at 0.1s to prevent huge jumps
            prevTime = time;
            
            // Calculate FPS
            frameCount++;
            const elapsed = time - lastFpsUpdate;
            
            if (elapsed >= 1000) {
                fps = Math.round((frameCount * 1000) / elapsed);
                frameCount = 0;
                lastFpsUpdate = time;
                
                // Update FPS display
                fpsDisplay.textContent = `FPS: ${fps} | Quality: ${adaptiveSettings.currentQuality}`;
                
                // Store in FPS history for adaptive quality
                adaptiveSettings.fpsHistory.push(fps);
                if (adaptiveSettings.fpsHistory.length > 5) {
                    adaptiveSettings.fpsHistory.shift();
                }
            }
            
            // Adaptive quality check (every 3 seconds)
            if (time - adaptiveSettings.lastCheck > 3000) {
                adaptiveSettings.lastCheck = time;
                
                // Calculate average FPS from history
                const avgFps = adaptiveSettings.fpsHistory.reduce((sum, value) => sum + value, 0) / 
                              adaptiveSettings.fpsHistory.length;
                
                if (avgFps < adaptiveSettings.targetFps * 0.8) {
                    adaptiveSettings.lowFpsCount++;
                    if (adaptiveSettings.lowFpsCount >= 2) {
                        adaptiveSettings.lowFpsCount = 0;
                        if (adaptiveSettings.currentQuality === 'high') {
                            setQualitySettings('medium');
                        } else if (adaptiveSettings.currentQuality === 'medium') {
                            setQualitySettings('low');
                        }
                    }
                } else if (avgFps > adaptiveSettings.targetFps * 1.2 && adaptiveSettings.currentQuality !== 'high') {
                    adaptiveSettings.lowFpsCount = 0;
                    if (adaptiveSettings.currentQuality === 'low') {
                        setQualitySettings('medium');
                    } else if (adaptiveSettings.currentQuality === 'medium') {
                        setQualitySettings('high');
                    }
                } else {
                    adaptiveSettings.lowFpsCount = 0;
                }
            }
            
            // Update mouse look controller to apply any smooth movement
            mouseLookController.update(delta);
            
            // Update game state with optimized distance checks
            updateGameState(delta);
            
            // Update only visible and nearby objects
            updateVisibleObjects(time, delta);
            
            // Use frustum culling to only render what's visible
            scene.children.forEach(child => {
                if (child.isMesh && child !== floor && !child.alwaysRender) {
                    child.visible = isInViewFrustum(child) && 
                        characterController.position.distanceTo(child.position) < adaptiveSettings.drawDistance;
                }
            });
            
            // Render scene
            renderer.render(scene, camera);
        }
        
        // Start load sequence
        let progress = 0;
        const loadInterval = setInterval(() => {
            progress += 5;
            progressFill.style.width = `${progress}%`;
            progressText.textContent = `Loading: ${progress}%`;
            
            if (progress >= 100) {
                clearInterval(loadInterval);
                
                // Hide loading screen
                setTimeout(() => {
                    loadingScreen.style.opacity = "0";
                    setTimeout(() => {
                        loadingScreen.style.display = "none";
                        
                        // Initialize and start the game
                        initGame();
                        
                        // Start animation loop
                        animate(performance.now());
                    }, 500);
                }, 500);
            }
        }, 100);
    </script>
</body>
